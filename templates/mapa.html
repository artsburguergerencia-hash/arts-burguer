<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rastreio ao Vivo | Art's Burguer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        #mapa { width: 100%; height: 100vh; z-index: 10; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 relative">

    <div id="loading" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[999] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-20 h-20 bg-brand-500 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(255,71,87,0.6)] mb-6 animate-pulse border-4 border-slate-800">
            <i class="ph-bold ph-satellite text-4xl text-white"></i>
        </div>
        <h2 class="text-2xl font-black text-white tracking-tight mb-2">Conectando...</h2>
        <p class="font-bold text-brand-400 text-sm uppercase tracking-widest animate-pulse text-center px-4">Buscando sinal do motoboy no satélite</p>
    </div>

    <!-- CABEÇALHO FLUTUANTE COM LOGO -->
    <div class="fixed top-0 left-0 w-full z-50 p-4 pointer-events-none">
        <div class="glass max-w-md mx-auto rounded-2xl shadow-lg border border-slate-200 p-4 flex items-center justify-between pointer-events-auto">
            <div class="flex items-center">
                
                <!-- 🚨 LOGO DINÂMICA INJETADA AQUI 🚨 -->
                <div id="header-logo-container" class="w-10 h-10 bg-brand-500 rounded-full flex items-center justify-center text-white font-black mr-3 shadow-md shadow-brand-500/40 border-2 border-transparent overflow-hidden shrink-0">
                    <i id="header-logo-letra" class="ph-bold ph-moped text-xl"></i>
                    <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
                </div>

                <div>
                    <h1 class="font-black text-slate-800 leading-tight" id="nome-loja-header">Rastreamento</h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Pedido #<span id="txt-pedido">--</span></p>
                </div>
            </div>
            <div id="status-sinal" class="w-3 h-3 bg-red-500 rounded-full shadow-[0_0_10px_rgba(239,68,68,0.8)] animate-pulse" title="Aguardando Sinal"></div>
        </div>
    </div>

    <div id="mapa"></div>

    <div class="fixed bottom-0 left-0 w-full z-50 p-4 pointer-events-none">
        <div class="glass max-w-md mx-auto rounded-2xl shadow-[0_-10px_30px_rgba(0,0,0,0.1)] border border-slate-200 p-5 pointer-events-auto">
            <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-1 flex items-center">
                <i class="ph-fill ph-info mr-1.5 text-brand-500"></i> Status do Motoboy
            </h2>
            <p id="txt-status" class="font-bold text-slate-800 leading-snug">Aguardando o entregador iniciar a rota...</p>
        </div>
    </div>

    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 500: '#ff4757', 600: '#e04050' } } } } };

        const urlParams = new URLSearchParams(window.location.search);
        const pedidoId = urlParams.get('pedido');
        
        if(pedidoId) {
            document.getElementById('txt-pedido').innerText = pedidoId;
        } else {
            document.getElementById('txt-status').innerText = "Erro: Número do pedido ausente no link.";
        }

        // 🚨 SCRIPT QUE BUSCA A LOGO NO BANCO 🚨
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/gestao/configuracoes'); 
                const configLoja = await res.json();
                
                if(configLoja.nome_empresa) document.getElementById('nome-loja-header').innerText = `${configLoja.nome_empresa} GPS`;

                if(configLoja.logo_url && configLoja.logo_url.trim() !== '' && configLoja.logo_url !== 'None') {
                    const letra = document.getElementById('header-logo-letra'); 
                    const img = document.getElementById('header-logo-img'); 
                    const container = document.getElementById('header-logo-container');
                    if(letra && img && container) {
                        img.onerror = function() { this.classList.add('hidden'); letra.classList.remove('hidden'); };
                        img.src = configLoja.logo_url; 
                        img.classList.remove('hidden');
                        letra.classList.add('hidden'); 
                        container.classList.remove('bg-brand-500'); 
                        container.classList.add('bg-white', 'border-slate-200');
                    }
                }
            } catch(e) {}
        });

        const map = L.map('mapa', { zoomControl: false }).setView([-15.7801, -47.9292], 4);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap | Rastreamento',
            maxZoom: 19
        }).addTo(map);

        const motoIcon = L.divIcon({
            html: `<div style="background-color: #ff4757; color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 3px solid white;"><i class="ph-fill ph-motorcycle" style="font-size: 26px;"></i></div>`,
            className: '',
            iconSize: [44, 44],
            iconAnchor: [22, 22]
        });

        let markerMotoboy = null;
        let primeiroFoco = true;

        async function buscarPosicaoMotoboy() {
            if(!pedidoId) return;

            try {
                const res = await fetch(`/api/logistica/gps/${pedidoId}`);
                const data = await res.json();

                if (data.status === "online" && data.posicao) {
                    document.getElementById('loading').style.opacity = '0';
                    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 500);

                    const lat = data.posicao.lat;
                    const lng = data.posicao.lng;

                    document.getElementById('status-sinal').className = "w-3 h-3 bg-emerald-500 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.8)] animate-pulse";
                    document.getElementById('txt-status').innerText = "O entregador está se aproximando do seu endereço com o pedido!";

                    if (!markerMotoboy) {
                        markerMotoboy = L.marker([lat, lng], { icon: motoIcon }).addTo(map);
                    } else {
                        markerMotoboy.setLatLng([lat, lng]);
                    }

                    if (primeiroFoco) {
                        map.setView([lat, lng], 16);
                        primeiroFoco = false;
                    } else {
                        map.panTo([lat, lng]); 
                    }
                } else {
                    document.getElementById('status-sinal').className = "w-3 h-3 bg-red-500 rounded-full shadow-[0_0_10px_rgba(239,68,68,0.8)] animate-pulse";
                }
            } catch (e) {
                console.log("Falha ao buscar GPS");
            }
        }

        setInterval(buscarPosicaoMotoboy, 5000);
        buscarPosicaoMotoboy(); 
    </script>
</body>
</html>
