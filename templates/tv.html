<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Senhas Premium | Art's Burguer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { 500: '#ff4757', 600: '#e04050' }, dark: { 950: '#05080f', 900: '#0B0F19', 800: '#151A27', 700: '#1F2639' } } } } }
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .destaque-pulse { animation: pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulseGlow { 
            0%, 100% { filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.2)); transform: scale(1); } 
            50% { filter: drop-shadow(0 0 40px rgba(16, 185, 129, 0.6)); transform: scale(1.02); } 
        }
        .fade-slide-up { animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .btn-rechamar { transition: all 0.2s ease-in-out; cursor: pointer; }
        .btn-rechamar:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn-rechamar:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-dark-950 text-slate-800 dark:text-slate-100 h-screen w-screen flex flex-col transition-colors duration-300">

    <audio id="som-chamada" src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_22dcd5dbda.mp3?filename=airport-chime-1-105102.mp3" preload="auto"></audio>

    <div id="tela-ativacao" class="fixed inset-0 z-50 bg-white/95 dark:bg-dark-950/95 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition-colors" onclick="iniciarTV()">
        <div id="start-logo-container" class="w-40 h-40 bg-brand-500 rounded-[2.5rem] flex items-center justify-center text-white font-black text-6xl shadow-[0_0_60px_rgba(255,71,87,0.4)] mb-10 overflow-hidden border-4 border-transparent transition-colors">
            <span id="start-logo-letra">A</span>
            <img id="start-logo-img" src="" class="w-full h-full object-cover hidden">
        </div>
        <h1 class="text-6xl font-black text-slate-900 dark:text-white tracking-tighter mb-4">TV Inteligente Pronta</h1>
        <p class="text-2xl font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-12">Toque para iniciar o painel e o áudio</p>
        <button class="bg-slate-900 dark:bg-white text-white dark:text-dark-950 px-12 py-6 rounded-full font-black uppercase tracking-widest text-xl shadow-2xl flex items-center hover:scale-105 transition-transform">
            <i class="ph-bold ph-power mr-3 text-3xl text-brand-500"></i> Iniciar Sistema
        </button>
    </div>

    <header class="h-28 px-10 flex items-center justify-between shrink-0 relative z-10 bg-white dark:bg-dark-900 shadow-md">
        <div class="flex items-center">
            <div id="header-logo-container" class="w-16 h-16 bg-brand-500 rounded-2xl flex items-center justify-center text-white font-black text-3xl shadow-[0_0_20px_rgba(255,71,87,0.4)] mr-5 overflow-hidden shrink-0 transition-colors">
                <span id="header-logo-letra">A</span>
                <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
            </div>
            <div>
                <h1 id="tv-nome-loja" class="text-3xl font-black tracking-tighter text-slate-900 dark:text-white leading-none">Art's Burguer</h1>
                <p class="text-[12px] font-black uppercase tracking-[0.3em] text-slate-400 dark:text-slate-500 mt-1">Status de Pedidos</p>
            </div>
        </div>
        <div class="flex items-center space-x-8">
            <button onclick="toggleTheme()" class="w-14 h-14 rounded-full flex items-center justify-center bg-slate-100 dark:bg-dark-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-dark-700 transition-colors shadow-inner">
                <i id="theme-icon" class="ph-bold ph-moon text-3xl"></i>
            </button>
            <div id="relogio" class="text-5xl font-black tracking-tighter text-slate-800 dark:text-white">00:00</div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden p-8 gap-8 relative bg-slate-100 dark:bg-dark-950">
        
        <div class="w-[35%] bg-white dark:bg-dark-900 rounded-[2.5rem] border border-slate-200 dark:border-dark-800 flex flex-col shadow-xl overflow-hidden transition-colors">
            <div class="bg-amber-500 py-6 text-center shrink-0 shadow-md z-10">
                <h2 class="font-black text-3xl uppercase tracking-widest text-white flex items-center justify-center gap-3">
                    <i class="ph-bold ph-cooking-pot text-4xl"></i> Preparando
                </h2>
            </div>
            <div class="flex-1 p-8 overflow-y-auto no-scrollbar bg-slate-50 dark:bg-dark-900/50 relative">
                <div class="absolute inset-0 bg-gradient-to-b from-amber-500/5 to-transparent pointer-events-none"></div>
                <div id="lista-preparo" class="grid grid-cols-2 gap-5 auto-rows-max relative z-10"></div>
            </div>
        </div>

        <div class="flex-1 bg-white dark:bg-dark-900 rounded-[2.5rem] border border-slate-200 dark:border-dark-800 flex flex-col shadow-xl overflow-hidden transition-colors">
            <div class="bg-emerald-500 py-6 text-center shrink-0 shadow-md z-10">
                <h2 class="font-black text-3xl uppercase tracking-widest text-white flex items-center justify-center gap-3">
                    <i class="ph-bold ph-check-circle text-4xl"></i> Retire Seu Pedido
                </h2>
            </div>
            
            <div class="flex-1 flex flex-col p-10 bg-slate-50 dark:bg-dark-900/50 relative">
                 <div class="absolute inset-0 bg-gradient-to-b from-emerald-500/5 to-transparent pointer-events-none"></div>
                <div id="destaque-pronto" class="flex-[2] flex flex-col items-center justify-center mb-10 relative z-10"></div>
                <div class="shrink-0 bg-white dark:bg-dark-800 p-8 rounded-3xl shadow-inner border border-slate-200 dark:border-dark-700 relative z-10">
                    <p class="text-sm font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-6 flex items-center justify-between">
                        <span class="flex items-center gap-2"><i class="ph-fill ph-clock-counter-clockwise text-lg"></i> Últimos Chamados:</span>
                        <span class="text-[10px] text-emerald-500/50 animate-pulse">Clique na senha para chamar novamente</span>
                    </p>
                    <div id="lista-pronto-fila" class="grid grid-cols-4 gap-5"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/gestao/configuracoes'); 
                const configLoja = await res.json();
                if(configLoja.nome_empresa) document.getElementById('tv-nome-loja').innerText = configLoja.nome_empresa;
                if(configLoja.logo_url && configLoja.logo_url.trim() !== '' && configLoja.logo_url !== 'None') {
                    document.getElementById('header-logo-img').src = configLoja.logo_url; document.getElementById('header-logo-img').classList.remove('hidden');
                    document.getElementById('header-logo-letra').classList.add('hidden'); document.getElementById('header-logo-container').classList.replace('bg-brand-500', 'bg-white');
                    document.getElementById('start-logo-img').src = configLoja.logo_url; document.getElementById('start-logo-img').classList.remove('hidden');
                    document.getElementById('start-logo-letra').classList.add('hidden'); document.getElementById('start-logo-container').classList.replace('bg-brand-500', 'bg-white');
                }
            } catch(e) {}
        });

        const themeIcon = document.getElementById('theme-icon');
        if (document.documentElement.classList.contains('dark') && themeIcon) themeIcon.classList.replace('ph-moon', 'ph-sun');

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light');
                if(themeIcon) themeIcon.classList.replace('ph-sun', 'ph-moon');
            } else {
                document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark');
                if(themeIcon) themeIcon.classList.replace('ph-moon', 'ph-sun');
            }
        }

        let ultimoPedidoProntoId = 0;
        let somAtivado = false;
        let ultimaCargaTV = "";
        let vozesDisponiveis = [];
        let timeoutDestaque = null;
        let pDestaqueOriginal = null;

        window.speechSynthesis.onvoiceschanged = () => { vozesDisponiveis = window.speechSynthesis.getVoices(); };

        setInterval(() => {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function iniciarTV() {
            somAtivado = true;
            document.getElementById('tela-ativacao').classList.add('hidden');
            const som = document.getElementById('som-chamada');
            som.volume = 0; som.play().then(() => { som.pause(); som.currentTime = 0; som.volume = 1; }).catch(()=>{});
            vozesDisponiveis = window.speechSynthesis.getVoices();
            atualizarTV();
        }

        function renderizarDestaque(senha, nomeVisual) {
            const destaque = document.getElementById('destaque-pronto');
            destaque.innerHTML = `
                <div onclick="chamarSenhaVoz('${senha}', '${nomeVisual}')" title="Clique para rechamar" class="btn-rechamar destaque-pulse fade-slide-up flex flex-col items-center justify-center group relative w-full h-full">
                    <span class="text-[14rem] font-black text-emerald-500 leading-none tracking-tighter drop-shadow-md">${senha}</span>
                    <span class="text-5xl font-black text-slate-800 dark:text-white mt-4 uppercase tracking-[0.2em] bg-emerald-100 dark:bg-emerald-500/20 px-8 py-3 rounded-full border-2 border-emerald-300 dark:border-emerald-500/50">${nomeVisual}</span>
                    <span class="absolute -bottom-10 opacity-0 group-hover:opacity-100 transition-opacity text-emerald-600 font-black tracking-widest uppercase flex items-center gap-2"><i class="ph-bold ph-speaker-high"></i> Clicar para rechamar</span>
                </div>`;
        }

        function chamarSenhaVoz(senha, nomeCompleto) {
            if (!somAtivado) return; 
            window.speechSynthesis.cancel();
            
            const som = document.getElementById('som-chamada');
            som.currentTime = 0; som.play().catch(()=>{});

            const primeiroNome = nomeCompleto ? nomeCompleto.split(' ')[0] : 'Cliente';

            // COLOCA EM DESTAQUE TEMPORÁRIO
            if(timeoutDestaque) clearTimeout(timeoutDestaque);
            renderizarDestaque(senha, primeiroNome);

            // VOLTA PARA O DESTAQUE ORIGINAL APÓS 6 SEGUNDOS
            timeoutDestaque = setTimeout(() => {
                if(pDestaqueOriginal) {
                    renderizarDestaque(pDestaqueOriginal.senha_diaria, pDestaqueOriginal.cliente_nome ? pDestaqueOriginal.cliente_nome.split(' ')[0] : 'Cliente');
                }
            }, 6000);

            setTimeout(() => {
                const frase = `Senha, ${senha}. ${primeiroNome}, seu pedido está pronto.`;
                const msg = new SpeechSynthesisUtterance(frase);
                msg.lang = 'pt-BR'; msg.rate = 0.95; msg.pitch = 1.0; 
                let vozesPT = vozesDisponiveis.filter(v => v.lang.includes('pt-BR') || v.lang.includes('pt_BR'));
                if (vozesPT.length > 0) {
                    let vozNatural = vozesPT.find(v => v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Luciana') || v.name.includes('Francisca'));
                    if (vozNatural) msg.voice = vozNatural; else msg.voice = vozesPT[0];
                }
                window.speechSynthesis.speak(msg);
            }, 1500); 
        }

        async function atualizarTV() {
            if(!somAtivado) return; 
            try {
                const res = await fetch('/api/tv/pedidos'); const dados = await res.json();
                
                const idsPreparo = (dados.em_preparo || []).map(p => p.id).sort().join(',');
                const idsProntos = (dados.prontos || []).map(p => p.id).sort().join(',');
                const assinaturaAtual = idsPreparo + "|" + idsProntos;
                if (assinaturaAtual === ultimaCargaTV) return; ultimaCargaTV = assinaturaAtual;
                
                const emPreparo = dados.em_preparo || [];
                let prontos = (dados.prontos || []).sort((a,b) => b.id - a.id);

                if (prontos.length > 0) {
                    const maisRecente = prontos[0];
                    if (ultimoPedidoProntoId !== 0 && maisRecente.id > ultimoPedidoProntoId && somAtivado) {
                        chamarSenhaVoz(maisRecente.senha_diaria, maisRecente.cliente_nome);
                    }
                    ultimoPedidoProntoId = Math.max(ultimoPedidoProntoId, maisRecente.id);
                }

                const gridPreparo = document.getElementById('lista-preparo');
                if (emPreparo.length === 0) {
                    gridPreparo.innerHTML = '<div class="col-span-2 text-center text-slate-400 dark:text-slate-600 font-bold mt-20 text-xl">Nenhum pedido na chapa</div>';
                } else {
                    gridPreparo.innerHTML = emPreparo.map(p => `<div class="bg-white dark:bg-dark-800 border-2 border-slate-200 dark:border-dark-700 rounded-3xl flex items-center justify-center py-8 shadow-sm fade-slide-up"><span class="text-6xl font-black text-slate-700 dark:text-white tracking-tighter">${p.senha_diaria}</span></div>`).join('');
                }

                const destaque = document.getElementById('destaque-pronto');
                const filaProntos = document.getElementById('lista-pronto-fila');
                
                if (prontos.length === 0) {
                    pDestaqueOriginal = null;
                    destaque.innerHTML = `<div class="flex flex-col items-center justify-center opacity-50"><i class="ph-fill ph-check-circle text-8xl text-slate-300 dark:text-slate-700 mb-6"></i><span class="text-slate-400 dark:text-slate-500 text-3xl font-black uppercase tracking-widest">Balcão Livre</span></div>`;
                    filaProntos.innerHTML = '<div class="col-span-4 text-center text-slate-400 dark:text-slate-600 font-bold text-lg mt-4">Aguardando novos pedidos...</div>';
                } else {
                    pDestaqueOriginal = prontos[0];
                    const nomeSeguroDestaque = pDestaqueOriginal.cliente_nome ? pDestaqueOriginal.cliente_nome.replace(/'/g, "\\'") : 'Cliente';
                    
                    // Só renderiza se não houver um destaque temporário rodando
                    if(!timeoutDestaque) {
                        renderizarDestaque(pDestaqueOriginal.senha_diaria, nomeSeguroDestaque.split(' ')[0]);
                    }

                    const outrosProntos = prontos.slice(1, 9); 
                    if (outrosProntos.length > 0) {
                        filaProntos.innerHTML = outrosProntos.map(p => {
                            const nomeSeguroFila = p.cliente_nome ? p.cliente_nome.replace(/'/g, "\\'") : '';
                            return `<div onclick="chamarSenhaVoz('${p.senha_diaria}', '${nomeSeguroFila}')" title="Chamar ${p.senha_diaria} novamente" class="btn-rechamar bg-emerald-50 dark:bg-emerald-500/10 border-2 border-emerald-200 dark:border-emerald-500/20 rounded-2xl flex items-center justify-center py-5 fade-slide-up hover:bg-emerald-100 dark:hover:bg-emerald-500/30"><span class="text-4xl font-black text-emerald-600 dark:text-emerald-400 tracking-tighter">${p.senha_diaria}</span></div>`;
                        }).join('');
                    } else {
                        filaProntos.innerHTML = '<div class="col-span-4 text-slate-400 dark:text-slate-600 font-bold text-sm">Apenas o pedido acima pronto no momento.</div>';
                    }
                }
            } catch(e) {}
        }
        setInterval(atualizarTV, 3000); 
    </script>
</body>
</html>
