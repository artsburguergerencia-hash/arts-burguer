<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ERP | Art's Burguer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#ff4757', 600: '#e04050' } } } } }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
    <style>body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }</style>
</head>
<body class="bg-slate-900 dark:bg-[#0b1120] min-h-screen flex items-center justify-center p-4 relative transition-colors duration-300">
    
    <!-- Botão Modo Escuro -->
    <button onclick="toggleTheme()" class="absolute top-6 right-6 w-12 h-12 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center transition-colors">
        <i id="theme-icon" class="ph-bold ph-moon text-xl"></i>
    </button>

    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-[2rem] shadow-2xl overflow-hidden transition-colors duration-300">
        <div class="p-10 flex flex-col items-center">
            
            <!-- 🚨 LOGO DINÂMICA 🚨 -->
            <div id="header-logo-container" class="w-20 h-20 bg-brand-50 dark:bg-brand-500/10 rounded-full flex items-center justify-center mb-6 shadow-inner border border-brand-100 dark:border-brand-500/20 overflow-hidden shrink-0 transition-colors duration-300">
                <i id="header-logo-letra" class="ph-fill ph-hamburger text-4xl text-brand-500"></i>
                <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
            </div>
            
            <h1 id="nome-loja-header" class="text-2xl font-black text-slate-800 dark:text-white tracking-tight mb-1">Art's Burguer</h1>
            <p class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-8 text-center">Acesso ao ERP Corporativo</p>

            <form onsubmit="fazerLogin(event)" class="w-full space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2 pl-1">Usuário</label>
                    <div class="relative">
                        <i class="ph-bold ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="text" id="usuario" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl py-4 pl-12 pr-4 text-sm font-bold text-slate-800 dark:text-white outline-none focus:border-brand-500 transition-colors shadow-inner" placeholder="Digite seu usuário">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2 pl-1">Senha</label>
                    <div class="relative">
                        <i class="ph-bold ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="password" id="senha" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl py-4 pl-12 pr-4 text-sm font-bold text-slate-800 dark:text-white outline-none focus:border-brand-500 transition-colors shadow-inner" placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" id="btn-login" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-black py-4 rounded-xl shadow-[0_10px_30px_rgba(255,71,87,0.3)] active:scale-95 transition-all uppercase tracking-widest text-xs mt-4 flex justify-center items-center">
                    <i class="ph-bold ph-sign-in mr-2 text-lg"></i> Entrar
                </button>
            </form>
        </div>
    </div>

    <script>
        const themeIcon = document.getElementById('theme-icon');
        if (document.documentElement.classList.contains('dark') && themeIcon) themeIcon.classList.replace('ph-moon', 'ph-sun');

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light');
                if(themeIcon) themeIcon.classList.replace('ph-sun', 'ph-moon');
            } else {
                document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark');
                if(themeIcon) themeIcon.classList.replace('ph-moon', 'ph-sun');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/gestao/configuracoes');
                const configLoja = await res.json();
                
                if(configLoja.nome_empresa) document.getElementById('nome-loja-header').innerText = configLoja.nome_empresa;
                
                // Puxa a logo do banco
                if(configLoja.logo_url && configLoja.logo_url.trim() !== '' && configLoja.logo_url !== 'None') {
                    const letra = document.getElementById('header-logo-letra'); 
                    const img = document.getElementById('header-logo-img'); 
                    const container = document.getElementById('header-logo-container');
                    
                    if(letra && img && container) {
                        img.onerror = function() { this.classList.add('hidden'); letra.classList.remove('hidden'); };
                        img.src = configLoja.logo_url; 
                        img.classList.remove('hidden');
                        letra.classList.add('hidden'); 
                        container.classList.remove('bg-brand-50', 'dark:bg-brand-500/10', 'border-brand-100', 'dark:border-brand-500/20'); 
                        container.classList.add('bg-white', 'border-slate-200', 'dark:border-slate-700');
                    }
                }
            } catch(e) {}
        });

        async function fazerLogin(e) {
            // A MÁGICA QUE IMPEDE A TELA DE PISCAR:
            e.preventDefault(); 
            
            const btn = e.target.querySelector('button[type="submit"]');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "<i class='ph-bold ph-spinner animate-spin mr-2'></i>Acessando...";
            btn.disabled = true;

            // Puxa o que foi digitado nos campos (verifique se os IDs no seu HTML são 'usuario' e 'senha')
            const usuarioStr = document.getElementById('usuario').value;
            const senhaStr = document.getElementById('senha').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioStr, senha: senhaStr })
                });
                
                const data = await res.json();

                if (res.ok && data.status === "sucesso") {
                    // Salva os dados blindados na memória do navegador
                    localStorage.setItem('funcionario_nome', data.nome);
                    localStorage.setItem('funcionario_cargo', data.cargo_id.toString());
                    
                    // SMART REDIRECT: Administrador (1) vai pro Gestão, outros vão pro Portal Hub
                    if (data.cargo_id === 1 || data.cargo_id === '1') {
                        window.location.replace('/gestao');
                    } else {
                        window.location.replace('/portal');
                    }
                } else {
                    // Mostra o alerta apenas se a senha/usuário estiver errado
                    alert(data.detail || "Usuário ou senha incorretos!");
                }
            } catch (error) {
                alert("Falha ao se conectar com o servidor. Verifique sua internet.");
            }

            // Devolve o botão ao estado normal se algo der errado
            btn.innerHTML = textoOriginal;
            btn.disabled = false;
        }
    </script>
</body>
</html>
