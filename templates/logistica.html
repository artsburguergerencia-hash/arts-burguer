<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho e Logística | Art's Burguer</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] }, 
                    colors: { brand: { 500: '#ff4757', 600: '#e04050' } } 
                } 
            } 
        };
        if (localStorage.getItem('theme') === 'dark') { document.documentElement.classList.add('dark'); }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animação suave para entrada dos cards */
        .card-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* Efeito de brilho suave nas colunas */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col h-screen overflow-hidden transition-colors duration-300">

    <!-- HEADER PREMIUM -->
    <header class="bg-white dark:bg-slate-900 h-20 md:h-24 flex items-center justify-between px-6 md:px-10 border-b border-slate-200 dark:border-slate-800 shrink-0 z-20 shadow-sm transition-colors relative">
        <div class="flex items-center">
            <div id="header-logo-container" class="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-brand-500 to-brand-600 rounded-xl flex items-center justify-center mr-4 shadow-lg shadow-brand-500/20 overflow-hidden border border-brand-400 dark:border-transparent shrink-0">
                <i id="header-logo-letra" class="ph-bold ph-moped text-2xl md:text-3xl text-white"></i>
                <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-800 dark:text-white">Central de Despacho</h1>
                <p class="text-[9px] md:text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest mt-0.5 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-2 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span> Sistema Integrado Ao Vivo
                </p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3 md:space-x-4">
            <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center transition-colors active:scale-95 shadow-sm border border-slate-200 dark:border-slate-700" title="Mudar Tema">
                <i id="theme-icon" class="ph-bold ph-moon text-lg md:text-xl"></i>
            </button>
            <button onclick="buscarPedidosLogistica(true)" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center transition-colors active:scale-95 shadow-sm border border-slate-200 dark:border-slate-700" title="Atualizar Agora">
                <i class="ph-bold ph-arrows-clockwise text-lg md:text-xl"></i>
            </button>
            <a href="/gestao" class="bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-500 dark:text-red-400 w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center transition-colors active:scale-95 border border-red-200 dark:border-red-500/20" title="Sair da Expedição">
                <i class="ph-bold ph-sign-out text-lg md:text-xl"></i>
            </a>
        </div>
    </header>

    <!-- KANBAN BOARD (GLASSMORPHISM) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-4 md:p-8 gap-6 md:gap-8 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] dark:bg-none relative">
        
        <!-- Fundo decorativo sutil no modo claro -->
        <div class="absolute inset-0 opacity-[0.03] pointer-events-none dark:hidden" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;"></div>

        <!-- COLUNA 1: AGUARDANDO SAÍDA -->
        <section class="flex-1 flex flex-col glass-panel rounded-3xl border border-white dark:border-slate-800 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] overflow-hidden z-10">
            <div class="p-5 md:p-6 bg-white/50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-800/80 flex justify-between items-center shrink-0">
                <h2 class="font-extrabold text-lg md:text-xl text-slate-800 dark:text-white flex items-center tracking-tight">
                    <div class="w-8 h-8 rounded-lg bg-amber-100 dark:bg-amber-500/20 flex items-center justify-center mr-3 border border-amber-200 dark:border-amber-500/30">
                        <i class="ph-fill ph-package text-amber-500 text-xl"></i>
                    </div>
                    Aguardando Saída
                </h2>
                <span class="bg-amber-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-black shadow-md shadow-amber-500/30" id="badge-prontos">0</span>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 no-scrollbar relative" id="lista-prontos">
                <!-- Loader Padrão -->
                <div class="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-600 opacity-60">
                    <i class="ph-bold ph-spinner animate-spin text-4xl mb-3"></i>
                    <p class="font-bold text-xs uppercase tracking-widest">Conectando...</p>
                </div>
            </div>
        </section>

        <!-- COLUNA 2: EM ROTA DE ENTREGA -->
        <section class="flex-1 flex flex-col glass-panel rounded-3xl border border-white dark:border-slate-800 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] overflow-hidden z-10 relative">
            <div class="p-5 md:p-6 bg-white/50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-800/80 flex justify-between items-center shrink-0">
                <h2 class="font-extrabold text-lg md:text-xl text-slate-800 dark:text-white flex items-center tracking-tight">
                    <div class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-500/20 flex items-center justify-center mr-3 border border-blue-200 dark:border-blue-500/30">
                        <i class="ph-fill ph-navigation-arrow text-blue-500 text-xl"></i>
                    </div>
                    Em Rota
                </h2>
                <span class="bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-black shadow-md shadow-blue-500/30" id="badge-rota">0</span>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 no-scrollbar relative" id="lista-rota">
                <!-- Loader Padrão -->
                <div class="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-600 opacity-60">
                    <i class="ph-fill ph-motorcycle text-5xl mb-3"></i>
                    <p class="font-bold text-xs uppercase tracking-widest">Nenhuma entrega ativa</p>
                </div>
            </div>
        </section>

    </main>

    <!-- MOTOR JAVASCRIPT INTACTO -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            buscarPedidosLogistica();
            try {
                const res = await fetch('/api/gestao/configuracoes'); 
                const configLoja = await res.json();
                
                if(configLoja.logo_url && configLoja.logo_url.trim() !== '' && configLoja.logo_url !== 'None') {
                    const letra = document.getElementById('header-logo-letra'); 
                    const img = document.getElementById('header-logo-img'); 
                    const container = document.getElementById('header-logo-container');
                    
                    img.onerror = function() { this.classList.add('hidden'); letra.classList.remove('hidden'); };
                    img.src = configLoja.logo_url; 
                    img.classList.remove('hidden');
                    letra.classList.add('hidden'); 
                    container.classList.remove('bg-gradient-to-br', 'from-brand-500', 'to-brand-600', 'border-brand-400'); 
                    container.classList.add('bg-white', 'border', 'border-slate-200', 'dark:border-slate-700');
                }
            } catch(e) {}
        });

        const themeIcon = document.getElementById('theme-icon');
        if (document.documentElement.classList.contains('dark') && themeIcon) themeIcon.classList.replace('ph-moon', 'ph-sun');

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                if(themeIcon) themeIcon.classList.replace('ph-sun', 'ph-moon');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                if(themeIcon) themeIcon.classList.replace('ph-moon', 'ph-sun');
            }
        }

        setInterval(() => buscarPedidosLogistica(false), 5000);

        let ultimaCargaLogistica = "";

        async function buscarPedidosLogistica(forcar = false) {
            try {
                const response = await fetch('/api/logistica/pedidos');
                const dados = await response.json();
                
                const jsonAtual = JSON.stringify(dados);
                if (!forcar && jsonAtual === ultimaCargaLogistica) return; // Anti-piscar
                ultimaCargaLogistica = jsonAtual;
                
                renderizarProntos(dados.prontos || []);
                renderizarEmRota(dados.em_rota || []);
                
                document.getElementById('badge-prontos').innerText = (dados.prontos || []).length;
                document.getElementById('badge-rota').innerText = (dados.em_rota || []).length;
            } catch (error) { console.error("Erro ao buscar dados logísticos:", error); }
        }

        function renderizarProntos(pedidos) {
            const container = document.getElementById('lista-prontos');
            if (pedidos.length === 0) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 opacity-60 transition-colors"><i class="ph-fill ph-check-circle text-5xl mb-3"></i><p class="font-bold text-xs uppercase tracking-widest">Expedição Limpa</p></div>`;
                return;
            }

            container.innerHTML = pedidos.map(p => {
                const isRetirada = (p.tipo && p.tipo.includes('RETIRADA')) || (p.endereco && p.endereco.includes('Retirada'));
                const endLimpo = p.endereco ? p.endereco.replace(/'/g, "\\'") : '';
                const corFaixa = isRetirada ? 'bg-purple-500' : 'bg-amber-400';
                const tagEstilo = isRetirada 
                    ? 'bg-purple-50 dark:bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-200 dark:border-purple-500/20' 
                    : 'bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-200 dark:border-amber-500/20';

                return `
                    <div class="card-enter bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm hover:shadow-md transition-all relative overflow-hidden group">
                        <!-- Linha indicadora lateral -->
                        <div class="absolute left-0 top-0 bottom-0 w-1.5 ${corFaixa}"></div>
                        
                        <div class="flex justify-between items-center pl-2 mb-3">
                            <div class="flex items-center space-x-2">
                                <span class="bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-widest border border-slate-200 dark:border-slate-700 shadow-sm">#${p.senha_diaria || p.id}</span>
                                <span class="${tagEstilo} px-2.5 py-1 rounded-md text-[9px] font-black uppercase tracking-widest border shadow-sm">${isRetirada ? 'Retirada' : 'Delivery'}</span>
                            </div>
                        </div>
                        
                        <div class="pl-2 mb-5">
                            <h3 class="font-black text-slate-800 dark:text-white text-lg mb-1 leading-tight tracking-tight">${p.cliente}</h3>
                            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 flex items-start leading-snug">
                                <i class="ph-fill ph-map-pin text-brand-500 mr-1.5 mt-0.5 text-sm shrink-0"></i> ${p.endereco}
                            </p>
                        </div>
                        
                        <div class="pl-2">
                            ${isRetirada ? `
                                <button onclick="concluirRetirada(${p.id}, this)" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-3.5 rounded-xl flex items-center justify-center transition-all active:scale-95 text-xs uppercase tracking-widest shadow-lg shadow-purple-500/30">
                                    <i class="ph-bold ph-check-circle mr-2 text-lg"></i> Cliente Retirou
                                </button>
                            ` : `
                                <div class="space-y-2.5">
                                    <div class="grid grid-cols-2 gap-2.5">
                                        <button onclick="copilotoDespacho(${p.id}, 'Uber', '${endLimpo}')" class="bg-slate-900 dark:bg-black hover:bg-slate-800 text-white font-black py-3 rounded-xl flex items-center justify-center transition-all active:scale-95 text-[10px] uppercase tracking-widest shadow-md">
                                            <i class="ph-fill ph-car-profile mr-1.5 text-base"></i> Uber
                                        </button>
                                        <button onclick="copilotoDespacho(${p.id}, '99', '${endLimpo}')" class="bg-[#FFD100] hover:bg-[#E6BC00] text-black font-black py-3 rounded-xl flex items-center justify-center transition-all active:scale-95 text-[10px] uppercase tracking-widest shadow-md">
                                            <i class="ph-fill ph-car-profile mr-1.5 text-base"></i> 99
                                        </button>
                                    </div>
                                    <button onclick="despacharMotoboyProprio(${p.id})" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-black py-3.5 rounded-xl flex items-center justify-center transition-all active:scale-95 text-[10px] uppercase tracking-widest shadow-lg shadow-brand-500/30">
                                        <i class="ph-fill ph-moped mr-2 text-lg"></i> Motoboy da Casa
                                    </button>
                                    <button onclick="window.open('/motoboy?pedido=${p.senha_diaria || p.id}&end=${encodeURIComponent(endLimpo)}', '_blank')" class="w-full bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold py-2.5 rounded-xl flex items-center justify-center transition-all active:scale-95 text-[10px] uppercase tracking-widest border border-slate-200 dark:border-slate-700 mt-1">
                                        <i class="ph-bold ph-qr-code mr-1.5 text-sm"></i> Enviar Link do GPS
                                    </button>
                                </div>
                            `}
                        </div>
                    </div>`;
            }).join('');
        }

        function renderizarEmRota(pedidos) {
            const container = document.getElementById('lista-rota');
            if (pedidos.length === 0) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 opacity-60 transition-colors"><i class="ph-fill ph-motorcycle text-5xl mb-3"></i><p class="font-bold text-xs uppercase tracking-widest">Nenhuma entrega ativa</p></div>`;
                return;
            }

            container.innerHTML = pedidos.map(p => {
                const endLimpo = p.endereco ? p.endereco.replace(/'/g, "\\'") : '';
                return `
                <div class="card-enter bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm hover:shadow-md transition-all relative overflow-hidden group">
                    <!-- Linha azul neon para "Em rota" -->
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.8)]"></div>
                    
                    <div class="flex justify-between items-center pl-2 mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-widest border border-slate-200 dark:border-slate-700 shadow-sm">#${p.senha_diaria || p.id}</span>
                            <span class="bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-500/20 px-2.5 py-1 rounded-md text-[9px] font-black uppercase tracking-widest flex items-center shadow-sm">
                                <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse mr-1.5"></span> A Caminho
                            </span>
                        </div>
                    </div>
                    
                    <div class="pl-2 mb-5">
                        <h3 class="font-black text-slate-800 dark:text-white text-lg mb-1 leading-tight tracking-tight">${p.cliente}</h3>
                        <p class="text-xs font-medium text-slate-500 dark:text-slate-400 flex items-start leading-snug">
                            <i class="ph-fill ph-map-pin text-blue-500 mr-1.5 mt-0.5 text-sm shrink-0"></i> ${p.endereco}
                        </p>
                    </div>
                    
                    <div class="flex space-x-2.5 pl-2">
                        <button onclick="abrirGPS('${endLimpo}')" class="bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-blue-600 dark:text-blue-400 border border-slate-200 dark:border-slate-700 font-black w-12 rounded-xl flex items-center justify-center transition-all active:scale-95 shadow-sm" title="Abrir no Maps">
                            <i class="ph-fill ph-navigation-arrow text-xl"></i>
                        </button>
                        <button onclick="marcarComoEntregue(${p.id}, this)" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl flex items-center justify-center transition-all active:scale-95 text-xs uppercase tracking-widest shadow-lg shadow-blue-500/30">
                            <i class="ph-bold ph-check-circle mr-2 text-lg"></i> Concluir Entrega
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // Funções lógicas originais preservadas
        function abrirGPS(endereco) {
            if(!endereco || endereco.includes('Retirada')) return alert("Endereço inválido para GPS.");
            const enderecoLimpo = endereco.replace('Endereço: ', '').trim();
            window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(enderecoLimpo)}`, '_blank');
        }

        async function copilotoDespacho(pedidoId, plataforma, enderecoFormatado) {
            const isUber = plataforma === 'Uber';
            const enderecoLimpo = enderecoFormatado.replace('Endereço: ', '').trim();
            try { await navigator.clipboard.writeText(enderecoLimpo); } catch(e) {}

            if (isUber) window.location.href = `uber://?action=setPickup&pickup=my_location&dropoff[formatted_address]=${encodeURIComponent(enderecoLimpo)}`;
            else { alert("Endereço copiado! 📋\nA 99 vai abrir."); window.location.href = "taxis99://"; }

            setTimeout(async () => {
                if(!confirm(`Já pediu a corrida na ${plataforma} para este cliente?`)) return;
                try {
                    const res = await fetch(`/api/logistica/pedidos/${pedidoId}/despachar`, {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nome_motoboy: `App Parceiro (${plataforma})` })
                    });
                    if(res.ok) { ultimaCargaLogistica = ""; buscarPedidosLogistica(true); } 
                } catch(e) { alert("Falha de conexão."); }
            }, 4000);
        }

        async function despacharMotoboyProprio(pedidoId) {
            const nomeMotoboy = prompt("Nome do Motoboy:", "Motoboy Próprio");
            if (nomeMotoboy === null) return;
            try {
                const res = await fetch(`/api/logistica/pedidos/${pedidoId}/despachar`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome_motoboy: nomeMotoboy })
                });
                if(res.ok) { ultimaCargaLogistica = ""; buscarPedidosLogistica(true); } 
            } catch(e) { alert("Falha de conexão."); }
        }

        async function concluirRetirada(pedidoId, btn) {
            if(!confirm("Confirmar que o cliente retirou o pedido?")) return;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i>';
            try {
                const res = await fetch(`/api/logistica/pedidos/${pedidoId}/entregar`, { method: 'PUT' });
                if(res.ok) { ultimaCargaLogistica = ""; buscarPedidosLogistica(true); } 
            } catch(e) {}
        }

        async function marcarComoEntregue(pedidoId, btn) {
            if(!confirm("Confirmar que foi entregue?")) return;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i>';
            try {
                const res = await fetch(`/api/logistica/pedidos/${pedidoId}/entregar`, { method: 'PUT' });
                if(res.ok) { ultimaCargaLogistica = ""; buscarPedidosLogistica(true); } 
            } catch(e) {}
        }
    </script>
</body>
</html>
