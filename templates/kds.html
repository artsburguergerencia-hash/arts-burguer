<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor KDS | Art's Burguer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 h-screen flex flex-col transition-colors duration-300 overflow-hidden">

    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex items-center justify-between shadow-sm shrink-0">
        <div class="flex items-center">
            <div id="header-logo-container" class="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center text-white font-black text-2xl shadow-lg border-2 border-transparent overflow-hidden shrink-0 mr-4 transition-colors">
                <i id="header-logo-letra" class="ph-bold ph-fire text-2xl"></i>
                <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white leading-none">MONITOR KDS</h1>
                <p class="text-[10px] font-bold tracking-widest text-amber-500 uppercase mt-1 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse mr-2"></span> Produção ao Vivo
                </p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <button id="btn-som" onclick="toggleSom()" class="p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-400 rounded-xl shadow-inner border border-slate-200 dark:border-slate-700" title="Ativar Som">
                <i class="ph-bold ph-speaker-slash text-xl"></i>
            </button>
            <button onclick="carregarKDS()" class="flex items-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 px-4 py-3 rounded-xl shadow-sm font-bold text-xs uppercase tracking-widest border border-slate-200 dark:border-slate-700">
                <i class="ph-bold ph-arrows-clockwise text-lg mr-2"></i> Atualizar
            </button>
            <button onclick="toggleTheme()" class="p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl shadow-inner border border-slate-200 dark:border-slate-700">
                <i id="theme-icon" class="ph-bold ph-moon text-xl"></i>
            </button>
            <a href="/gestao" class="bg-red-50 dark:bg-red-500/10 text-red-500 p-3 rounded-xl border border-red-200 dark:border-red-500/20"><i class="ph-bold ph-sign-out text-xl"></i></a>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden p-6 space-x-6">
        <section class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-800/50 rounded-[2rem] border border-slate-200 dark:border-slate-700 overflow-hidden shadow-inner">
            <div class="p-4 bg-slate-200/50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center shrink-0">
                <h2 class="font-black text-lg text-slate-700 dark:text-slate-300 flex items-center"><i class="ph-bold ph-receipt text-slate-500 mr-2 text-xl"></i> Fila de Preparo</h2>
                <span class="bg-slate-700 dark:bg-slate-600 text-white px-3 py-1 rounded-lg text-xs font-black shadow-sm" id="badge-fila">0</span>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar" id="lista-fila"></div>
        </section>

        <section class="flex-1 flex flex-col bg-amber-50/50 dark:bg-amber-900/10 rounded-[2rem] border border-amber-200 dark:border-amber-700/50 overflow-hidden shadow-inner relative">
            <div class="absolute inset-0 opacity-5 pointer-events-none flex items-center justify-center overflow-hidden"><i class="ph-fill ph-fire text-[300px] text-amber-500"></i></div>
            <div class="relative z-10 p-4 bg-amber-100 dark:bg-amber-900/40 border-b border-amber-200 dark:border-amber-700/50 flex justify-between items-center shrink-0">
                <h2 class="font-black text-lg text-amber-800 dark:text-amber-500 flex items-center"><i class="ph-fill ph-fire text-amber-500 mr-2 text-xl animate-pulse"></i> Na Chapa</h2>
                <span class="bg-amber-500 text-white px-3 py-1 rounded-lg text-xs font-black shadow-sm" id="badge-chapa">0</span>
            </div>
            <div class="relative z-10 flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar" id="lista-chapa"></div>
        </section>
    </main>

    <script>
        let somAtivado = false;
        let ultimoIdPedido = 0;
        let ultimaCargaDeDados = ""; // Memória para não piscar a tela à toa

        function toggleSom() {
            somAtivado = !somAtivado;
            const btn = document.getElementById('btn-som');
            if(somAtivado) {
                btn.classList.replace('text-slate-400', 'text-amber-500');
                btn.innerHTML = '<i class="ph-bold ph-speaker-high text-xl animate-pulse"></i>';
                falarNomeAviso();
            } else {
                btn.classList.replace('text-amber-500', 'text-slate-400');
                btn.innerHTML = '<i class="ph-bold ph-speaker-slash text-xl"></i>';
            }
        }

        function falarNomeAviso() {
            if(!somAtivado) return;
            const msg = new SpeechSynthesisUtterance("Art's!");
            msg.lang = 'pt-BR'; window.speechSynthesis.speak(msg);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            carregarKDS();
            try {
                const res = await fetch('/api/gestao/configuracoes'); const configLoja = await res.json();
                if(configLoja.logo_url && configLoja.logo_url !== 'None') {
                    document.getElementById('header-logo-img').src = configLoja.logo_url; 
                    document.getElementById('header-logo-img').classList.remove('hidden');
                    document.getElementById('header-logo-letra').classList.add('hidden'); 
                    document.getElementById('header-logo-container').classList.remove('bg-amber-500'); 
                    document.getElementById('header-logo-container').classList.add('bg-white', 'border-slate-200');
                }
            } catch(e) {}
        });

        setInterval(carregarKDS, 4000); 

        async function carregarKDS() {
            try {
                const response = await fetch('/api/kds/pedidos'); 
                const dados = await response.json();
                const jsonString = JSON.stringify(dados);
                
                // SE NADA MUDOU, NÃO PISCA A TELA!
                if(jsonString === ultimaCargaDeDados) return; 
                ultimaCargaDeDados = jsonString;

                const recebidos = dados.recebidos || [];
                const preparando = dados.preparando || [];

                let maiorIdAtual = 0;
                recebidos.forEach(p => { if (p.id > maiorIdAtual) maiorIdAtual = p.id; });
                preparando.forEach(p => { if (p.id > maiorIdAtual) maiorIdAtual = p.id; });
                
                if (ultimoIdPedido > 0 && maiorIdAtual > ultimoIdPedido) { falarNomeAviso(); }
                if (maiorIdAtual > ultimoIdPedido) { ultimoIdPedido = maiorIdAtual; }

                renderFila(recebidos); renderChapa(preparando);
                document.getElementById('badge-fila').innerText = recebidos.length;
                document.getElementById('badge-chapa').innerText = preparando.length;
            } catch (e) {}
        }

        function imprimirPedido(id) {
            // Se o seu Python tem uma rota de impressão, ele vai chamar aqui:
            fetch(`/api/pedidos/${id}/imprimir`, { method: 'POST' }).catch(()=>{});
            alert(`Comanda #${id} enviada para a impressora!`);
        }

        async function mudarStatus(id, novoStatus, botao) {
            // MAGIA: SOME DA TELA NA HORA SEM ESPERAR O SERVIDOR (Evita travamentos)
            const card = botao.closest('.card-enter');
            if(card) card.style.display = 'none';

            fetch(`/api/kds/pedidos/${id}/status`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            }).then(() => {
                ultimaCargaDeDados = ""; // Força o KDS a re-desenhar a tela depois que salvar
                carregarKDS(); 
            }).catch(e => {
                if(card) card.style.display = 'block'; // Volta se deu erro
                alert("Erro de conexão ao mover o pedido.");
            });
        }

        function gerarHTMLComanda(p, isChapa) {
            const senha = p.senha_diaria || p.id;
            const origem = p.origem || 'BALCAO';
            const itensHTML = (p.itens || []).map(item => `
                <div class="py-2 border-b border-slate-100 dark:border-slate-700/50 last:border-0">
                    <div class="flex items-start">
                        <span class="font-black text-amber-500 mr-2">${item.quantidade}x</span>
                        <div class="flex-1">
                            <p class="font-bold text-slate-800 dark:text-slate-200 text-sm">${item.nome || 'Item'}</p>
                            ${item.observacao ? `<p class="text-xs font-semibold text-red-500 mt-1 bg-red-50 dark:bg-red-500/10 inline-block px-2 py-0.5 rounded">⚠️ ${item.observacao}</p>` : ''}
                        </div>
                    </div>
                </div>`).join('');

            return `
            <div class="card-enter bg-white dark:bg-slate-800 border ${isChapa ? 'border-2 border-amber-400 shadow-amber-500/10' : 'border-slate-200'} rounded-2xl p-4 shadow-sm relative overflow-hidden mb-3">
                <div class="flex justify-between items-center mb-3 border-b border-slate-100 dark:border-slate-700 pb-2">
                    <h3 class="font-black ${isChapa ? 'text-2xl text-amber-600' : 'text-xl text-slate-800 dark:text-white'} tracking-tighter">#${senha}</h3>
                    <div class="flex space-x-2">
                        <span class="text-[10px] font-black uppercase tracking-widest bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded">${origem}</span>
                        <!-- BOTÃO DE IMPRIMIR -->
                        <button onclick="imprimirPedido(${p.id})" class="text-slate-400 hover:text-blue-500 bg-slate-100 dark:bg-slate-700 p-1 rounded" title="Imprimir Comanda"><i class="ph-bold ph-printer text-lg"></i></button>
                    </div>
                </div>
                <div class="mb-4 space-y-1">${itensHTML}</div>
                <button onclick="mudarStatus(${p.id}, '${isChapa ? 'PRONTO' : 'EM_PREPARO'}', this)" class="w-full ${isChapa ? 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-500/30 text-sm' : 'bg-slate-800 hover:bg-slate-700 text-xs'} text-white font-black py-3 rounded-xl uppercase tracking-widest transition-colors shadow-md">
                    ${isChapa ? '<i class="ph-bold ph-check-circle mr-2 text-lg"></i> Pedido Pronto!' : '🔥 Jogar na Chapa'}
                </button>
            </div>`;
        }

        function renderFila(pedidos) { document.getElementById('lista-fila').innerHTML = pedidos.length ? pedidos.map(p => gerarHTMLComanda(p, false)).join('') : `<div class="h-full flex flex-col items-center justify-center text-slate-300"><i class="ph-fill ph-check-circle text-5xl mb-2"></i><p class="font-bold text-xs">FILA LIMPA</p></div>`; }
        function renderChapa(pedidos) { document.getElementById('lista-chapa').innerHTML = pedidos.length ? pedidos.map(p => gerarHTMLComanda(p, true)).join('') : `<div class="h-full flex flex-col items-center justify-center text-amber-200"><i class="ph-fill ph-fire text-5xl mb-2"></i><p class="font-bold text-xs">CHAPA FRIA</p></div>`; }
    </script>
</body>
</html>
