<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor KDS de Alta Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }, colors: { brand: { 500: '#ff4757' }, dark: { 900: '#111827', 800: '#1F2937', 700: '#374151' } } } } }
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .ticket-enter { animation: ticketIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes ticketIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body class="bg-slate-200 dark:bg-[#0a0f18] text-slate-800 dark:text-slate-100 h-screen flex flex-col transition-colors duration-300 overflow-hidden">

    <header class="bg-white dark:bg-dark-900 border-b-4 border-brand-500 px-6 py-4 flex items-center justify-between shadow-xl shrink-0 z-20">
        <div class="flex items-center gap-4">
            <div id="header-logo-container" class="w-12 h-12 bg-brand-500 rounded-lg flex items-center justify-center text-white text-2xl shadow-lg border border-transparent overflow-hidden">
                <i id="header-logo-letra" class="ph-bold ph-cooking-pot"></i>
                <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight uppercase">Monitor de Produção</h1>
                <p class="text-[11px] font-black tracking-widest text-slate-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> SISTEMA KDS ONLINE</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <button id="btn-som" onclick="toggleSom()" class="bg-slate-100 dark:bg-dark-800 p-3 rounded-lg text-slate-400 shadow-inner border border-slate-200 dark:border-dark-700 hover:bg-slate-200 transition-colors"><i class="ph-bold ph-speaker-slash text-xl"></i></button>
            <button onclick="carregarKDS()" class="bg-slate-100 dark:bg-dark-800 p-3 rounded-lg text-brand-500 shadow-inner border border-slate-200 dark:border-dark-700 hover:bg-slate-200 transition-colors"><i class="ph-bold ph-arrows-clockwise text-xl"></i></button>
            <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-dark-800 p-3 rounded-lg text-slate-600 dark:text-white shadow-inner border border-slate-200 dark:border-dark-700 hover:bg-slate-200 transition-colors"><i id="theme-icon" class="ph-bold ph-moon text-xl"></i></button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden p-6 gap-6 relative">
        
        <!-- COLUNA 1 -->
        <section class="flex-1 flex flex-col bg-slate-300/50 dark:bg-[#0f1522] rounded-2xl border border-slate-300 dark:border-dark-800 overflow-hidden shadow-inner">
            <div class="bg-slate-800 dark:bg-dark-800 px-6 py-4 flex justify-between items-center shadow-md z-10">
                <h2 class="font-black text-white text-xl uppercase tracking-wider flex items-center gap-3"><i class="ph-fill ph-receipt text-slate-400"></i> Entradas / Fila</h2>
                <span class="bg-slate-600 text-white px-3 py-1 rounded font-mono font-bold" id="badge-fila">0</span>
            </div>
            <!-- GRID DE TICKETS -->
            <div class="flex-1 overflow-y-auto p-4 z-10 no-scrollbar">
                <div id="lista-fila" class="grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <!-- COLUNA 2 -->
        <section class="flex-1 flex flex-col bg-amber-500/5 dark:bg-amber-900/10 rounded-2xl border border-amber-500/20 overflow-hidden shadow-inner relative">
            <i class="ph-fill ph-fire absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[40rem] text-amber-500/5 dark:text-amber-500/5 pointer-events-none"></i>
            <div class="bg-amber-500 px-6 py-4 flex justify-between items-center shadow-md z-10">
                <h2 class="font-black text-white text-xl uppercase tracking-wider flex items-center gap-3"><i class="ph-fill ph-fire animate-pulse text-white"></i> Na Chapa</h2>
                <span class="bg-amber-700 text-white px-3 py-1 rounded font-mono font-bold" id="badge-chapa">0</span>
            </div>
            <!-- GRID DE TICKETS -->
            <div class="flex-1 overflow-y-auto p-4 z-10 no-scrollbar relative">
                <div id="lista-chapa" class="grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-4"></div>
            </div>
        </section>

    </main>

    <script>
        const themeIcon = document.getElementById('theme-icon');
        if (document.documentElement.classList.contains('dark') && themeIcon) themeIcon.classList.replace('ph-moon', 'ph-sun');

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light');
                if (themeIcon) themeIcon.classList.replace('ph-sun', 'ph-moon');
            } else {
                document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark');
                if (themeIcon) themeIcon.classList.replace('ph-moon', 'ph-sun');
            }
        }

        let somAtivado = false;
        let ultimoIdPedido = 0;
        let ultimaCargaDeDados = "";

        function toggleSom() {
            somAtivado = !somAtivado;
            const btn = document.getElementById('btn-som');
            if(somAtivado) {
                btn.classList.replace('text-slate-400', 'text-brand-500');
                btn.innerHTML = '<i class="ph-bold ph-speaker-high text-xl animate-pulse"></i>';
                falarNomeAviso();
            } else {
                btn.classList.replace('text-brand-500', 'text-slate-400');
                btn.innerHTML = '<i class="ph-bold ph-speaker-slash text-xl"></i>';
            }
        }

        function falarNomeAviso() {
            if(!somAtivado) return;
            const msg = new SpeechSynthesisUtterance("Novo Pedido");
            msg.lang = 'pt-BR'; window.speechSynthesis.speak(msg);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            carregarKDS();
            try {
                const res = await fetch('/api/gestao/configuracoes'); const configLoja = await res.json();
                if(configLoja.logo_url && configLoja.logo_url !== 'None') {
                    document.getElementById('header-logo-img').src = configLoja.logo_url; 
                    document.getElementById('header-logo-img').classList.remove('hidden');
                    document.getElementById('header-logo-letra').classList.add('hidden'); 
                    document.getElementById('header-logo-container').classList.replace('bg-brand-500', 'bg-white');
                }
            } catch(e) {}
        });

        setInterval(carregarKDS, 4000); 

        async function carregarKDS() {
            try {
                const response = await fetch('/api/kds/pedidos'); const dados = await response.json();
                const jsonString = JSON.stringify(dados);
                if(jsonString === ultimaCargaDeDados) return; ultimaCargaDeDados = jsonString;

                const recebidos = dados.recebidos || [];
                const preparando = dados.preparando || [];

                let maiorIdAtual = 0;
                recebidos.forEach(p => { if (p.id > maiorIdAtual) maiorIdAtual = p.id; });
                preparando.forEach(p => { if (p.id > maiorIdAtual) maiorIdAtual = p.id; });
                
                if (ultimoIdPedido > 0 && maiorIdAtual > ultimoIdPedido) { falarNomeAviso(); }
                if (maiorIdAtual > ultimoIdPedido) { ultimoIdPedido = maiorIdAtual; }

                renderFila(recebidos); renderChapa(preparando);
                document.getElementById('badge-fila').innerText = recebidos.length;
                document.getElementById('badge-chapa').innerText = preparando.length;
            } catch (e) {}
        }

        function imprimirPedido(id) {
            fetch(`/api/pedidos/${id}/imprimir`, { method: 'POST' }).catch(()=>{});
        }

        async function mudarStatus(id, novoStatus, botao) {
            const card = botao.closest('.ticket-enter');
            if(card) card.style.display = 'none';

            fetch(`/api/kds/pedidos/${id}/status`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            }).then(() => {
                ultimaCargaDeDados = ""; carregarKDS(); 
            }).catch(e => {
                if(card) card.style.display = 'block'; 
            });
        }

        // 🚨 VISUAL DE "TICKET DE COZINHA" 🚨
        function gerarHTMLComanda(p, isChapa) {
            const senha = p.senha_diaria || p.id;
            const origem = p.origem || 'BALCAO';
            
            const itensHTML = (p.itens || []).map(item => `
                <div class="py-2 border-b border-slate-200 dark:border-dark-700 border-dashed last:border-0">
                    <div class="flex items-start gap-2">
                        <span class="font-black text-xl text-red-600 font-mono">${item.quantidade}</span>
                        <div class="flex-1 mt-0.5">
                            <p class="font-bold text-slate-900 dark:text-slate-100 leading-tight">${item.nome || 'Item'}</p>
                            ${item.observacao ? `<p class="text-xs font-bold text-slate-800 dark:text-white mt-1 bg-yellow-300 dark:bg-amber-600 inline-block px-2 py-0.5 rounded shadow-sm"><i class="ph-bold ph-warning"></i> ${item.observacao}</p>` : ''}
                        </div>
                    </div>
                </div>`).join('');

            return `
            <div class="ticket-enter bg-white dark:bg-dark-800 rounded-lg shadow-lg flex flex-col overflow-hidden border border-slate-300 dark:border-dark-700">
                <div class="${isChapa ? 'bg-amber-500 text-white' : 'bg-slate-800 text-white'} px-4 py-3 flex justify-between items-center shadow-sm">
                    <h3 class="font-black text-3xl font-mono tracking-tighter">#${senha}</h3>
                    <div class="flex flex-col items-end gap-1">
                        <span class="text-[9px] font-black uppercase tracking-widest bg-black/20 px-2 py-0.5 rounded">${origem}</span>
                        <button onclick="imprimirPedido(${p.id})" class="text-white hover:text-black/50 transition-colors" title="Imprimir"><i class="ph-fill ph-printer text-xl"></i></button>
                    </div>
                </div>
                <div class="p-4 flex-1 bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')] dark:bg-none">
                    ${itensHTML}
                </div>
                <button onclick="mudarStatus(${p.id}, '${isChapa ? 'PRONTO' : 'EM_PREPARO'}', this)" class="w-full ${isChapa ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-slate-200 dark:bg-dark-700 hover:bg-slate-300 dark:hover:bg-dark-600'} text-slate-900 dark:text-white font-black py-4 uppercase tracking-widest text-sm transition-colors flex items-center justify-center gap-2 border-t border-slate-300 dark:border-dark-700">
                    ${isChapa ? '<i class="ph-bold ph-check-circle text-xl"></i> Pronto' : '<i class="ph-bold ph-fire text-xl text-brand-500"></i> Assumir'}
                </button>
            </div>`;
        }

        function renderFila(pedidos) { document.getElementById('lista-fila').innerHTML = pedidos.length ? pedidos.map(p => gerarHTMLComanda(p, false)).join('') : `<div class="col-span-full h-40 flex flex-col items-center justify-center text-slate-400"><i class="ph-fill ph-check-circle text-4xl mb-2"></i><p class="font-bold text-sm">FILA VAZIA</p></div>`; }
        function renderChapa(pedidos) { document.getElementById('lista-chapa').innerHTML = pedidos.length ? pedidos.map(p => gerarHTMLComanda(p, true)).join('') : `<div class="col-span-full h-40 flex flex-col items-center justify-center text-amber-500/50"><i class="ph-fill ph-fire text-4xl mb-2"></i><p class="font-bold text-sm">CHAPA FRIA</p></div>`; }
    </script>
</body>
</html>
