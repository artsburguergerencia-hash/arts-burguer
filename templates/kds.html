<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor KDS Premium | Art's Burguer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { 500: '#ff4757', 600: '#e04050' } } } } }
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<!-- O Fundo agora é um tom escuro premium (slate-950) no modo noturno -->
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 h-screen flex flex-col transition-colors duration-300 overflow-hidden">

    <!-- HEADER PREMIUM -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800/60 px-6 py-4 flex items-center justify-between shadow-sm shrink-0 z-20 relative transition-colors">
        <div class="flex items-center">
            <div id="header-logo-container" class="w-14 h-14 bg-brand-500 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-brand-500/30 border-2 border-transparent overflow-hidden shrink-0 mr-4 transition-all">
                <i id="header-logo-letra" class="ph-bold ph-fire text-3xl"></i>
                <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white leading-none">Monitor KDS</h1>
                <p class="text-[10px] font-bold tracking-widest text-brand-500 uppercase mt-1 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse mr-2 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span> Produção ao Vivo
                </p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <button id="btn-som" onclick="toggleSom()" class="p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-400 dark:text-slate-500 rounded-xl shadow-inner border border-slate-200 dark:border-slate-700 transition-colors" title="Ativar Som">
                <i class="ph-bold ph-speaker-slash text-xl"></i>
            </button>
            <button onclick="carregarKDS()" class="flex items-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 px-5 py-3 rounded-xl shadow-sm font-bold text-xs uppercase tracking-widest border border-slate-200 dark:border-slate-700 transition-colors">
                <i class="ph-bold ph-arrows-clockwise text-lg mr-2 text-brand-500"></i> Atualizar
            </button>
            <button onclick="toggleTheme()" class="p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl shadow-inner border border-slate-200 dark:border-slate-700 transition-colors">
                <i id="theme-icon" class="ph-bold ph-moon text-xl text-slate-600 dark:text-slate-300"></i>
            </button>
            <a href="/gestao" class="bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-500 p-3 rounded-xl border border-red-200 dark:border-red-500/20 transition-colors"><i class="ph-bold ph-sign-out text-xl"></i></a>
        </div>
    </header>

    <!-- ÁREA DAS COLUNAS -->
    <main class="flex-1 flex overflow-hidden p-6 space-x-6">
        
        <!-- COLUNA 1: FILA DE PREPARO -->
        <section class="flex-1 flex flex-col bg-slate-200/50 dark:bg-slate-900 rounded-[2rem] border border-slate-300 dark:border-slate-800 overflow-hidden shadow-inner relative transition-colors">
            <div class="p-5 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700/60 flex justify-between items-center shrink-0 z-10 shadow-sm transition-colors">
                <h2 class="font-black text-xl text-slate-800 dark:text-slate-100 flex items-center gap-3 tracking-tight">
                    <div class="p-2 bg-slate-100 dark:bg-slate-900 rounded-xl"><i class="ph-bold ph-receipt text-brand-500 text-2xl"></i></div>
                    Fila de Preparo
                </h2>
                <span class="bg-brand-500 text-white px-4 py-1.5 rounded-xl text-sm font-black shadow-md shadow-brand-500/20" id="badge-fila">0</span>
            </div>
            <div class="flex-1 overflow-y-auto p-5 space-y-4 no-scrollbar z-10" id="lista-fila"></div>
        </section>

        <!-- COLUNA 2: NA CHAPA -->
        <section class="flex-1 flex flex-col bg-amber-50 dark:bg-amber-900/5 rounded-[2rem] border border-amber-200 dark:border-amber-900/30 overflow-hidden shadow-inner relative transition-colors">
            <div class="absolute inset-0 opacity-5 dark:opacity-[0.02] pointer-events-none flex items-center justify-center overflow-hidden z-0"><i class="ph-fill ph-fire text-[400px] text-amber-500"></i></div>
            <div class="p-5 bg-amber-100/50 dark:bg-amber-900/20 border-b border-amber-200 dark:border-amber-900/40 flex justify-between items-center shrink-0 z-10 shadow-sm backdrop-blur-sm transition-colors">
                <h2 class="font-black text-xl text-amber-900 dark:text-amber-500 flex items-center gap-3 tracking-tight">
                    <div class="p-2 bg-amber-200/50 dark:bg-amber-950 rounded-xl"><i class="ph-fill ph-fire text-amber-500 text-2xl animate-pulse"></i></div>
                    Na Chapa
                </h2>
                <span class="bg-amber-500 text-white px-4 py-1.5 rounded-xl text-sm font-black shadow-md shadow-amber-500/20" id="badge-chapa">0</span>
            </div>
            <div class="relative z-10 flex-1 overflow-y-auto p-5 space-y-4 no-scrollbar" id="lista-chapa"></div>
        </section>

    </main>

    <script>
        // 🚨 O BOTÃO DE TEMA CONSERTADO E 100% FUNCIONAL 🚨
        const themeIcon = document.getElementById('theme-icon');
        if (document.documentElement.classList.contains('dark') && themeIcon) {
            themeIcon.classList.replace('ph-moon', 'ph-sun');
        }

        function toggleTheme() {
            const htmlElement = document.documentElement;
            const tIcon = document.getElementById('theme-icon');
            
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                if (tIcon) tIcon.classList.replace('ph-sun', 'ph-moon');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                if (tIcon) tIcon.classList.replace('ph-moon', 'ph-sun');
            }
        }

        let somAtivado = false;
        let ultimoIdPedido = 0;
        let ultimaCargaDeDados = "";

        function toggleSom() {
            somAtivado = !somAtivado;
            const btn = document.getElementById('btn-som');
            if(somAtivado) {
                btn.classList.replace('text-slate-400', 'text-amber-500');
                btn.classList.replace('dark:text-slate-500', 'text-amber-500');
                btn.innerHTML = '<i class="ph-bold ph-speaker-high text-xl animate-pulse"></i>';
                falarNomeAviso();
            } else {
                btn.classList.replace('text-amber-500', 'text-slate-400');
                btn.innerHTML = '<i class="ph-bold ph-speaker-slash text-xl"></i>';
            }
        }

        function falarNomeAviso() {
            if(!somAtivado) return;
            const msg = new SpeechSynthesisUtterance("Art's!");
            msg.lang = 'pt-BR'; window.speechSynthesis.speak(msg);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            carregarKDS();
            try {
                const res = await fetch('/api/gestao/configuracoes'); const configLoja = await res.json();
                if(configLoja.logo_url && configLoja.logo_url !== 'None') {
                    document.getElementById('header-logo-img').src = configLoja.logo_url; 
                    document.getElementById('header-logo-img').classList.remove('hidden');
                    document.getElementById('header-logo-letra').classList.add('hidden'); 
                    document.getElementById('header-logo-container').classList.remove('bg-brand-500'); 
                    document.getElementById('header-logo-container').classList.add('bg-white', 'border-slate-200');
                }
            } catch(e) {}
        });

        setInterval(carregarKDS, 4000); 

        async function carregarKDS() {
            try {
                const response = await fetch('/api/kds/pedidos'); 
                const dados = await response.json();
                const jsonString = JSON.stringify(dados);
                
                if(jsonString === ultimaCargaDeDados) return; 
                ultimaCargaDeDados = jsonString;

                const recebidos = dados.recebidos || [];
                const preparando = dados.preparando || [];

                let maiorIdAtual = 0;
                recebidos.forEach(p => { if (p.id > maiorIdAtual) maiorIdAtual = p.id; });
                preparando.forEach(p => { if (p.id > maiorIdAtual) maiorIdAtual = p.id; });
                
                if (ultimoIdPedido > 0 && maiorIdAtual > ultimoIdPedido) { falarNomeAviso(); }
                if (maiorIdAtual > ultimoIdPedido) { ultimoIdPedido = maiorIdAtual; }

                renderFila(recebidos); renderChapa(preparando);
                document.getElementById('badge-fila').innerText = recebidos.length;
                document.getElementById('badge-chapa').innerText = preparando.length;
            } catch (e) {}
        }

        function imprimirPedido(id) {
            fetch(`/api/pedidos/${id}/imprimir`, { method: 'POST' }).catch(()=>{});
            alert(`Comanda #${id} enviada para a impressora!`);
        }

        async function mudarStatus(id, novoStatus, botao) {
            const card = botao.closest('.card-enter');
            if(card) card.style.display = 'none';

            fetch(`/api/kds/pedidos/${id}/status`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            }).then(() => {
                ultimaCargaDeDados = ""; 
                carregarKDS(); 
            }).catch(e => {
                if(card) card.style.display = 'block'; 
                alert("Erro de conexão ao mover o pedido.");
            });
        }

        // 🚨 O NOVO VISUAL DAS COMANDAS (TICKETS PROFISSIONAIS) 🚨
        function gerarHTMLComanda(p, isChapa) {
            const senha = p.senha_diaria || p.id;
            const origem = p.origem || 'BALCAO';
            
            const itensHTML = (p.itens || []).map(item => `
                <div class="py-3 border-b border-slate-100 dark:border-slate-700/60 last:border-0">
                    <div class="flex items-start">
                        <span class="font-black text-lg ${isChapa ? 'text-amber-500' : 'text-brand-500'} mr-3 w-8 text-right">${item.quantidade}x</span>
                        <div class="flex-1 mt-0.5">
                            <p class="font-bold text-slate-800 dark:text-slate-100 text-base leading-tight">${item.nome || 'Item'}</p>
                            ${item.observacao ? `<p class="text-xs font-bold text-red-600 dark:text-red-400 mt-1.5 bg-red-50 dark:bg-red-500/10 inline-block px-2.5 py-1 rounded-md border border-red-100 dark:border-red-500/20">⚠️ ${item.observacao}</p>` : ''}
                        </div>
                    </div>
                </div>`).join('');

            return `
            <div class="card-enter bg-white dark:bg-slate-800 border-l-4 ${isChapa ? 'border-l-amber-500 border-y border-r border-slate-200 dark:border-slate-700 shadow-amber-500/10' : 'border-l-brand-500 border-y border-r border-slate-200 dark:border-slate-700'} rounded-2xl shadow-md relative overflow-hidden transition-all hover:shadow-lg">
                
                <!-- Cabeçalho do Ticket -->
                <div class="px-5 py-3 bg-slate-50 dark:bg-slate-900/50 flex justify-between items-center border-b border-slate-200 dark:border-slate-700/60">
                    <div class="flex items-center gap-3">
                        <h3 class="font-black text-2xl text-slate-800 dark:text-white tracking-tighter">#${senha}</h3>
                        <span class="text-[10px] font-black uppercase tracking-widest bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-md">${origem}</span>
                    </div>
                    <button onclick="imprimirPedido(${p.id})" class="text-slate-400 hover:text-brand-500 dark:hover:text-brand-400 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-lg transition-colors shadow-sm" title="Imprimir Comanda"><i class="ph-bold ph-printer text-xl"></i></button>
                </div>
                
                <!-- Lista de Lanches -->
                <div class="px-5 py-2">
                    ${itensHTML}
                </div>
                
                <!-- Rodapé com o Botão de Ação -->
                <div class="p-4 bg-slate-50 dark:bg-slate-900/30 border-t border-slate-100 dark:border-slate-700/60">
                    <button onclick="mudarStatus(${p.id}, '${isChapa ? 'PRONTO' : 'EM_PREPARO'}', this)" class="w-full ${isChapa ? 'bg-emerald-500 hover:bg-emerald-600 text-white' : 'bg-slate-800 hover:bg-slate-900 dark:bg-brand-600 dark:hover:bg-brand-500 text-white'} font-black py-4 rounded-xl uppercase tracking-widest text-sm transition-all shadow-md active:scale-[0.98] flex items-center justify-center gap-2">
                        ${isChapa ? '<i class="ph-bold ph-check-circle text-xl"></i> Pedido Pronto!' : '<i class="ph-bold ph-fire text-xl"></i> Jogar na Chapa'}
                    </button>
                </div>
            </div>`;
        }

        function renderFila(pedidos) { document.getElementById('lista-fila').innerHTML = pedidos.length ? pedidos.map(p => gerarHTMLComanda(p, false)).join('') : `<div class="h-full flex flex-col items-center justify-center text-slate-300 dark:text-slate-700"><div class="w-20 h-20 bg-slate-200 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4"><i class="ph-fill ph-check-circle text-4xl"></i></div><p class="font-bold text-xs uppercase tracking-widest">FILA LIMPA</p></div>`; }
        function renderChapa(pedidos) { document.getElementById('lista-chapa').innerHTML = pedidos.length ? pedidos.map(p => gerarHTMLComanda(p, true)).join('') : `<div class="h-full flex flex-col items-center justify-center text-amber-200 dark:text-amber-900/50"><div class="w-20 h-20 bg-amber-100 dark:bg-amber-900/20 rounded-full flex items-center justify-center mb-4"><i class="ph-fill ph-fire text-4xl"></i></div><p class="font-bold text-xs uppercase tracking-widest">CHAPA FRIA</p></div>`; }
    </script>
</body>
</html>
