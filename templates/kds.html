<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor KDS | Art's Burguer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CONFIGURAÇÃO DO TEMA CLARO/ESCURO -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <!-- SINCRONIZAÇÃO GLOBAL DE TEMA -->
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 h-screen flex flex-col transition-colors duration-300 overflow-hidden">

    <!-- HEADER DO KDS -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex items-center justify-between shadow-sm shrink-0 transition-colors duration-300">
        <div class="flex items-center">
            <div class="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center mr-4 shadow-lg shadow-amber-500/30">
                <i class="ph-bold ph-fire text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white leading-none">MONITOR KDS</h1>
                <p class="text-[10px] font-bold tracking-widest text-amber-500 uppercase mt-1 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse mr-2"></span> Produção ao Vivo
                </p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <button onclick="carregarKDS()" class="flex items-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-4 py-3 rounded-xl transition-colors shadow-sm font-bold text-xs uppercase tracking-widest border border-slate-200 dark:border-slate-700">
                <i class="ph-bold ph-arrows-clockwise text-lg mr-2"></i> Atualizar
            </button>
            <button onclick="toggleTheme()" class="p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl transition-colors shadow-inner border border-slate-200 dark:border-slate-700">
                <i id="theme-icon" class="ph-bold ph-moon text-xl"></i>
            </button>
            <a href="/gestao" class="bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-500 p-3 rounded-xl transition-colors border border-red-200 dark:border-red-500/20">
                <i class="ph-bold ph-sign-out text-xl"></i>
            </a>
        </div>
    </header>

    <!-- ÁREA DAS COMANDAS -->
    <main class="flex-1 flex overflow-hidden p-6 space-x-6">
        
        <!-- COLUNA 1: FILA DE PREPARO -->
        <section class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-800/50 rounded-[2rem] border border-slate-200 dark:border-slate-700 overflow-hidden shadow-inner">
            <div class="p-4 bg-slate-200/50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center shrink-0">
                <h2 class="font-black text-lg text-slate-700 dark:text-slate-300 flex items-center">
                    <i class="ph-bold ph-receipt text-slate-500 mr-2 text-xl"></i> Fila de Preparo
                </h2>
                <span class="bg-slate-700 dark:bg-slate-600 text-white px-3 py-1 rounded-lg text-xs font-black shadow-sm" id="badge-fila">0</span>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar" id="lista-fila">
                <div class="h-full flex flex-col items-center justify-center text-slate-400 opacity-50">
                    <i class="ph-bold ph-spinner animate-spin text-5xl mb-4"></i>
                    <p class="font-bold text-sm uppercase tracking-widest">Buscando...</p>
                </div>
            </div>
        </section>

        <!-- COLUNA 2: NA CHAPA -->
        <section class="flex-1 flex flex-col bg-amber-50/50 dark:bg-amber-900/10 rounded-[2rem] border border-amber-200 dark:border-amber-700/50 overflow-hidden shadow-inner relative">
            <!-- Fundo decorativo -->
            <div class="absolute inset-0 opacity-5 dark:opacity-[0.02] pointer-events-none flex items-center justify-center overflow-hidden">
                <i class="ph-fill ph-fire text-[300px] text-amber-500"></i>
            </div>
            
            <div class="relative z-10 p-4 bg-amber-100 dark:bg-amber-900/40 border-b border-amber-200 dark:border-amber-700/50 flex justify-between items-center shrink-0">
                <h2 class="font-black text-lg text-amber-800 dark:text-amber-500 flex items-center">
                    <i class="ph-fill ph-fire text-amber-500 mr-2 text-xl animate-pulse"></i> Na Chapa
                </h2>
                <span class="bg-amber-500 text-white px-3 py-1 rounded-lg text-xs font-black shadow-sm" id="badge-chapa">0</span>
            </div>
            <div class="relative z-10 flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar" id="lista-chapa">
                <!-- Injetado via JS -->
            </div>
        </section>

    </main>

    <script>
        // MOTOR DE TEMA
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');
        if (htmlElement.classList.contains('dark')) themeIcon.classList.replace('ph-moon', 'ph-sun');

        function toggleTheme() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.classList.replace('ph-sun', 'ph-moon');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.replace('ph-moon', 'ph-sun');
            }
        }

        // MOTOR DO KDS
        document.addEventListener('DOMContentLoaded', carregarKDS);
        setInterval(carregarKDS, 5000); // Auto-Refresh a cada 5s

        async function carregarKDS() {
            try {
                // Supondo que sua rota de KDS retorna os pedidos
                const response = await fetch('/api/kds/pedidos'); 
                const dados = await response.json();
                
                renderFila(dados.recebidos || []);
                renderChapa(dados.preparando || []);
                
                document.getElementById('badge-fila').innerText = (dados.recebidos || []).length;
                document.getElementById('badge-chapa').innerText = (dados.preparando || []).length;
            } catch (error) {
                console.error("Erro no KDS:", error);
            }
        }

        // FUNÇÃO DE MUDAR STATUS
        async function mudarStatus(id, novoStatus, botao) {
            const textoOriginal = botao.innerHTML;
            botao.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg"></i>';
            botao.disabled = true;

            try {
                const res = await fetch(`/api/kds/pedidos/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: novoStatus })
                });

                if(res.ok) {
                    carregarKDS(); // Recarrega a tela instantaneamente
                } else {
                    alert("Falha ao atualizar o pedido no banco de dados.");
                    botao.innerHTML = textoOriginal;
                    botao.disabled = false;
                }
            } catch(e) {
                alert("Erro de conexão.");
                botao.innerHTML = textoOriginal;
                botao.disabled = false;
            }
        }

        function gerarHTMLComanda(p, isChapa) {
            const senha = p.senha_diaria || p.id;
            const origem = p.origem || 'BALCAO';
            const itensHTML = (p.itens || []).map(item => `
                <div class="py-2 border-b border-slate-100 dark:border-slate-700/50 last:border-0">
                    <div class="flex items-start">
                        <span class="font-black text-amber-500 mr-2">${item.quantidade}x</span>
                        <div class="flex-1">
                            <p class="font-bold text-slate-800 dark:text-slate-200 text-sm">${item.nome}</p>
                            ${item.observacao ? `<p class="text-xs font-semibold text-red-500 mt-1 bg-red-50 dark:bg-red-500/10 inline-block px-2 py-0.5 rounded">⚠️ ${item.observacao}</p>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            if (!isChapa) {
                // CARD DA FILA DE PREPARO
                return `
                <div class="card-enter bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-slate-300 dark:bg-slate-600"></div>
                    <div class="flex justify-between items-center mb-3 border-b border-slate-100 dark:border-slate-700 pb-2">
                        <h3 class="font-black text-xl text-slate-800 dark:text-white tracking-tighter">#${senha}</h3>
                        <span class="text-[10px] font-black uppercase tracking-widest bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 px-2 py-1 rounded">${origem}</span>
                    </div>
                    <div class="mb-4 space-y-1">
                        ${itensHTML}
                    </div>
                    <button onclick="mudarStatus(${p.id}, 'PREPARANDO', this)" class="w-full bg-slate-800 hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-black py-3 rounded-xl uppercase tracking-widest text-xs transition-colors shadow-md">
                        🔥 Jogar na Chapa
                    </button>
                </div>`;
            } else {
                // CARD DA CHAPA
                return `
                <div class="card-enter bg-white dark:bg-slate-800 border-2 border-amber-400 dark:border-amber-500 rounded-2xl p-4 shadow-lg shadow-amber-500/10 relative overflow-hidden">
                    <div class="flex justify-between items-center mb-3 border-b border-amber-100 dark:border-slate-700 pb-2">
                        <h3 class="font-black text-2xl text-amber-600 dark:text-amber-400 tracking-tighter">#${senha}</h3>
                        <span class="text-[10px] font-black uppercase tracking-widest bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300 px-2 py-1 rounded animate-pulse">${origem}</span>
                    </div>
                    <div class="mb-4 space-y-1">
                        ${itensHTML}
                    </div>
                    <button onclick="mudarStatus(${p.id}, 'PRONTO', this)" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-xl uppercase tracking-widest text-sm transition-colors shadow-lg shadow-emerald-500/30 flex items-center justify-center">
                        <i class="ph-bold ph-check-circle mr-2 text-lg"></i> Pedido Pronto!
                    </button>
                </div>`;
            }
        }

        function renderFila(pedidos) {
            const cont = document.getElementById('lista-fila');
            if(pedidos.length === 0) {
                cont.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-300 dark:text-slate-600"><i class="ph-fill ph-check-circle text-5xl mb-2"></i><p class="font-bold text-xs uppercase tracking-widest">Fila Limpa</p></div>`;
                return;
            }
            cont.innerHTML = pedidos.map(p => gerarHTMLComanda(p, false)).join('');
        }

        function renderChapa(pedidos) {
            const cont = document.getElementById('lista-chapa');
            if(pedidos.length === 0) {
                cont.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-amber-200 dark:text-slate-600"><i class="ph-fill ph-fire text-5xl mb-2 opacity-50"></i><p class="font-bold text-xs uppercase tracking-widest opacity-50">Chapa Fria</p></div>`;
                return;
            }
            cont.innerHTML = pedidos.map(p => gerarHTMLComanda(p, true)).join('');
        }
    </script>
</body>
</html>
