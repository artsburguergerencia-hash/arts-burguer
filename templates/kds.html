<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor KDS Premium | Art's Burguer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] }, 
                    colors: { brand: { 500: '#ff4757', 600: '#e04050' } } 
                } 
            } 
        }
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .card-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(20px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        
        /* Efeito Glassmorphism para as colunas */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 h-screen flex flex-col transition-colors duration-300 overflow-hidden relative">

    <!-- Fundo decorativo sutil (Pontilhado) -->
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none dark:hidden z-0" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;"></div>

    <!-- HEADER PREMIUM -->
    <header class="bg-white dark:bg-slate-900 h-20 md:h-24 flex items-center justify-between px-6 md:px-10 border-b border-slate-200 dark:border-slate-800 shrink-0 z-20 shadow-sm transition-colors relative">
        <div class="flex items-center">
            <div id="header-logo-container" class="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-brand-500 to-brand-600 rounded-xl flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-brand-500/30 border border-brand-400 dark:border-transparent overflow-hidden shrink-0 mr-4 transition-all">
                <i id="header-logo-letra" class="ph-bold ph-fire text-2xl md:text-3xl"></i>
                <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-800 dark:text-white leading-none">Monitor KDS</h1>
                <p class="text-[9px] md:text-[10px] font-bold tracking-widest text-brand-500 uppercase mt-1 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse mr-2 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span> Produção ao Vivo
                </p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3 md:space-x-4">
            <!-- Botão de Som -->
            <button id="btn-som" onclick="toggleSom()" class="w-10 h-10 md:w-12 md:h-12 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-400 dark:text-slate-500 flex items-center justify-center rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors active:scale-95" title="Ativar Som de Notificação">
                <i class="ph-bold ph-speaker-slash text-lg md:text-xl"></i>
            </button>
            <!-- Botão Atualizar -->
            <button onclick="carregarKDS()" class="flex items-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 px-4 md:px-5 h-10 md:h-12 rounded-xl shadow-sm font-bold text-[10px] md:text-xs uppercase tracking-widest border border-slate-200 dark:border-slate-700 transition-colors active:scale-95 text-slate-600 dark:text-slate-300">
                <i class="ph-bold ph-arrows-clockwise text-base md:text-lg mr-2 text-brand-500"></i> Atualizar
            </button>
            <!-- Botão Tema -->
            <button onclick="toggleTheme()" class="w-10 h-10 md:w-12 md:h-12 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors active:scale-95">
                <i id="theme-icon" class="ph-bold ph-moon text-lg md:text-xl text-slate-600 dark:text-slate-300"></i>
            </button>
            <!-- Botão Sair -->
            <a href="/gestao" class="w-10 h-10 md:w-12 md:h-12 bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-500 dark:text-red-400 flex items-center justify-center rounded-xl border border-red-200 dark:border-red-500/20 transition-colors active:scale-95" title="Sair do KDS">
                <i class="ph-bold ph-sign-out text-lg md:text-xl"></i>
            </a>
        </div>
    </header>

    <!-- ÁREA DAS COLUNAS KANBAN -->
    <main class="flex-1 flex overflow-hidden p-4 md:p-8 gap-6 md:gap-8 z-10 relative">
        
        <!-- COLUNA 1: FILA DE PREPARO -->
        <section class="flex-1 flex flex-col glass-panel rounded-3xl border border-white dark:border-slate-800 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] overflow-hidden transition-colors relative">
            <div class="absolute inset-0 opacity-[0.015] dark:opacity-[0.03] pointer-events-none flex items-center justify-center overflow-hidden z-0"><i class="ph-fill ph-receipt text-[400px] text-brand-500"></i></div>
            
            <div class="p-5 md:p-6 bg-white/60 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-800/80 flex justify-between items-center shrink-0 z-10">
                <h2 class="font-extrabold text-lg md:text-xl text-slate-800 dark:text-white flex items-center tracking-tight">
                    <div class="w-8 h-8 rounded-lg bg-brand-50 dark:bg-brand-500/20 flex items-center justify-center mr-3 border border-brand-100 dark:border-brand-500/30">
                        <i class="ph-fill ph-receipt text-brand-500 text-xl"></i>
                    </div>
                    Fila de Preparo
                </h2>
                <span class="bg-brand-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-black shadow-md shadow-brand-500/30" id="badge-fila">0</span>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 no-scrollbar z-10" id="lista-fila">
                <div class="h-full flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 opacity-60">
                    <i class="ph-bold ph-spinner animate-spin text-4xl mb-3"></i>
                    <p class="font-bold text-xs uppercase tracking-widest">Carregando...</p>
                </div>
            </div>
        </section>

        <!-- COLUNA 2: NA CHAPA -->
        <section class="flex-1 flex flex-col glass-panel rounded-3xl border border-white dark:border-slate-800 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] overflow-hidden transition-colors relative">
            <div class="absolute inset-0 opacity-[0.02] dark:opacity-[0.03] pointer-events-none flex items-center justify-center overflow-hidden z-0"><i class="ph-fill ph-fire text-[400px] text-amber-500"></i></div>
            
            <div class="p-5 md:p-6 bg-white/60 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-800/80 flex justify-between items-center shrink-0 z-10">
                <h2 class="font-extrabold text-lg md:text-xl text-slate-800 dark:text-white flex items-center tracking-tight">
                    <div class="w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-500/20 flex items-center justify-center mr-3 border border-amber-100 dark:border-amber-500/30">
                        <i class="ph-fill ph-fire text-amber-500 text-xl animate-pulse"></i>
                    </div>
                    Na Chapa
                </h2>
                <span class="bg-amber-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-black shadow-md shadow-amber-500/30" id="badge-chapa">0</span>
            </div>
            
            <div class="relative z-10 flex-1 overflow-y-auto p-4 md:p-6 space-y-4 no-scrollbar" id="lista-chapa">
                <div class="h-full flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 opacity-60">
                    <i class="ph-bold ph-spinner animate-spin text-4xl mb-3"></i>
                    <p class="font-bold text-xs uppercase tracking-widest">Carregando...</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        // MOTOR DE TEMA E SOM INTACTOS
        const themeIcon = document.getElementById('theme-icon');
        if (document.documentElement.classList.contains('dark') && themeIcon) { themeIcon.classList.replace('ph-moon', 'ph-sun'); }

        function toggleTheme() {
            const htmlElement = document.documentElement;
            const tIcon = document.getElementById('theme-icon');
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark'); localStorage.setItem('theme', 'light');
                if (tIcon) tIcon.classList.replace('ph-sun', 'ph-moon');
            } else {
                htmlElement.classList.add('dark'); localStorage.setItem('theme', 'dark');
                if (tIcon) tIcon.classList.replace('ph-moon', 'ph-sun');
            }
        }

        let somAtivado = false;
        let ultimoIdPedido = 0;
        let ultimaCargaDeDados = "";

        function toggleSom() {
            somAtivado = !somAtivado;
            const btn = document.getElementById('btn-som');
            if(somAtivado) {
                btn.classList.replace('text-slate-400', 'text-amber-500');
                btn.classList.replace('dark:text-slate-500', 'text-amber-500');
                btn.classList.replace('bg-slate-100', 'bg-amber-50');
                btn.classList.replace('dark:bg-slate-800', 'dark:bg-amber-500/10');
                btn.innerHTML = '<i class="ph-bold ph-speaker-high text-xl md:text-2xl animate-pulse"></i>';
                falarNomeAviso();
            } else {
                btn.classList.replace('text-amber-500', 'text-slate-400');
                btn.classList.replace('bg-amber-50', 'bg-slate-100');
                btn.classList.replace('dark:bg-amber-500/10', 'dark:bg-slate-800');
                btn.innerHTML = '<i class="ph-bold ph-speaker-slash text-lg md:text-xl"></i>';
            }
        }

        function falarNomeAviso() {
            if(!somAtivado) return;
            const msg = new SpeechSynthesisUtterance("Art's!");
            msg.lang = 'pt-BR'; window.speechSynthesis.speak(msg);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            carregarKDS();
            try {
                const res = await fetch('/api/gestao/configuracoes'); const configLoja = await res.json();
                if(configLoja.logo_url && configLoja.logo_url !== 'None') {
                    document.getElementById('header-logo-img').src = configLoja.logo_url; 
                    document.getElementById('header-logo-img').classList.remove('hidden');
                    document.getElementById('header-logo-letra').classList.add('hidden'); 
                    document.getElementById('header-logo-container').classList.remove('bg-gradient-to-br', 'from-brand-500', 'to-brand-600', 'border-brand-400'); 
                    document.getElementById('header-logo-container').classList.add('bg-white', 'border-slate-200', 'dark:border-slate-700');
                }
            } catch(e) {}
        });

        setInterval(carregarKDS, 4000); 

        async function carregarKDS() {
            try {
                const response = await fetch('/api/kds/pedidos'); 
                const dados = await response.json();
                const jsonString = JSON.stringify(dados);
                
                if(jsonString === ultimaCargaDeDados) return; 
                ultimaCargaDeDados = jsonString;

                const recebidos = dados.recebidos || [];
                const preparando = dados.preparando || [];

                let maiorIdAtual = 0;
                recebidos.forEach(p => { if (p.id > maiorIdAtual) maiorIdAtual = p.id; });
                preparando.forEach(p => { if (p.id > maiorIdAtual) maiorIdAtual = p.id; });
                
                if (ultimoIdPedido > 0 && maiorIdAtual > ultimoIdPedido) { falarNomeAviso(); }
                if (maiorIdAtual > ultimoIdPedido) { ultimoIdPedido = maiorIdAtual; }

                renderFila(recebidos); renderChapa(preparando);
                document.getElementById('badge-fila').innerText = recebidos.length;
                document.getElementById('badge-chapa').innerText = preparando.length;
            } catch (e) {}
        }

        function imprimirPedido(id) {
            fetch(`/api/pedidos/${id}/imprimir`, { method: 'POST' }).catch(()=>{});
            alert(`Comanda #${id} enviada para a impressora!`);
        }

        async function mudarStatus(id, novoStatus, botao) {
            const card = botao.closest('.card-enter');
            if(card) card.style.display = 'none';

            fetch(`/api/kds/pedidos/${id}/status`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            }).then(() => {
                ultimaCargaDeDados = ""; 
                carregarKDS(); 
            }).catch(e => {
                if(card) card.style.display = 'block'; 
                alert("Erro de conexão ao mover o pedido.");
            });
        }

        // 🚨 O NOVO VISUAL DAS COMANDAS (TICKETS PROFISSIONAIS) 🚨
        function gerarHTMLComanda(p, isChapa) {
            const senha = p.senha_diaria || p.id;
            const origem = p.origem || 'BALCAO';
            
            const itensHTML = (p.itens || []).map(item => `
                <div class="py-3 border-b border-slate-100 dark:border-slate-700/60 last:border-0">
                    <div class="flex items-start">
                        <span class="font-black text-lg ${isChapa ? 'text-amber-500' : 'text-brand-500'} mr-3 w-8 text-right bg-${isChapa ? 'amber' : 'brand'}-50 dark:bg-${isChapa ? 'amber' : 'brand'}-500/10 px-1 py-0.5 rounded shadow-sm">${item.quantidade}x</span>
                        <div class="flex-1 mt-0.5">
                            <p class="font-extrabold text-slate-800 dark:text-slate-100 text-base leading-tight tracking-tight">${item.nome || 'Item'}</p>
                            ${item.observacao ? `<p class="text-xs font-bold text-red-600 dark:text-red-400 mt-2 bg-red-50 dark:bg-red-500/10 inline-block px-3 py-1.5 rounded-lg border border-red-100 dark:border-red-500/20 shadow-sm leading-snug"><i class="ph-fill ph-warning-circle"></i> ${item.observacao}</p>` : ''}
                        </div>
                    </div>
                </div>`).join('');

            // Cores baseadas na coluna
            const corBorda = isChapa ? 'bg-amber-500 shadow-[0_0_12px_rgba(245,158,11,0.6)]' : 'bg-brand-500 shadow-[0_0_12px_rgba(255,71,87,0.6)]';
            const btnCor = isChapa ? 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-emerald-500/30' : 'bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 dark:text-slate-900 text-white shadow-slate-900/20 dark:shadow-white/20';

            return `
            <div class="card-enter bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/60 rounded-2xl shadow-sm hover:shadow-md transition-all relative overflow-hidden group">
                
                <!-- Faixa lateral neon -->
                <div class="absolute left-0 top-0 bottom-0 w-1.5 ${corBorda}"></div>
                
                <!-- Cabeçalho do Ticket -->
                <div class="px-5 py-3 md:py-4 bg-slate-50/50 dark:bg-slate-900/30 flex justify-between items-center border-b border-slate-100 dark:border-slate-800/80">
                    <div class="flex items-center gap-3 pl-2">
                        <h3 class="font-black text-2xl md:text-3xl text-slate-800 dark:text-white tracking-tighter">#${senha}</h3>
                        <span class="text-[9px] font-black uppercase tracking-widest bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-md border border-slate-300 dark:border-slate-600 shadow-inner">${origem}</span>
                    </div>
                    <button onclick="imprimirPedido(${p.id})" class="text-slate-400 hover:text-brand-500 dark:text-slate-500 dark:hover:text-brand-400 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 md:p-2.5 rounded-xl transition-colors shadow-sm active:scale-95" title="Imprimir Comanda"><i class="ph-bold ph-printer text-lg md:text-xl"></i></button>
                </div>
                
                <!-- Lista de Lanches -->
                <div class="px-5 py-3 md:py-4 pl-7">
                    ${itensHTML}
                </div>
                
                <!-- Rodapé com o Botão de Ação -->
                <div class="p-4 md:p-5 bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700/60">
                    <button onclick="mudarStatus(${p.id}, '${isChapa ? 'PRONTO' : 'EM_PREPARO'}', this)" class="w-full ${btnCor} font-black py-4 md:py-4 rounded-xl uppercase tracking-widest text-xs transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-2">
                        ${isChapa ? '<i class="ph-bold ph-check-circle text-lg md:text-xl"></i> Concluir: Pedido Pronto' : '<i class="ph-bold ph-fire text-lg md:text-xl"></i> Iniciar: Jogar na Chapa'}
                    </button>
                </div>
            </div>`;
        }

        function renderFila(pedidos) { 
            document.getElementById('lista-fila').innerHTML = pedidos.length ? pedidos.map(p => gerarHTMLComanda(p, false)).join('') : `
            <div class="h-full flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 opacity-60 transition-colors">
                <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800/80 rounded-full flex items-center justify-center mb-4 border border-slate-200 dark:border-slate-700 shadow-inner">
                    <i class="ph-fill ph-receipt text-4xl"></i>
                </div>
                <p class="font-bold text-xs uppercase tracking-widest">Fila Limpa</p>
            </div>`; 
        }

        function renderChapa(pedidos) { 
            document.getElementById('lista-chapa').innerHTML = pedidos.length ? pedidos.map(p => gerarHTMLComanda(p, true)).join('') : `
            <div class="h-full flex flex-col items-center justify-center text-amber-500 dark:text-amber-600 opacity-60 transition-colors">
                <div class="w-20 h-20 bg-amber-100 dark:bg-amber-900/20 rounded-full flex items-center justify-center mb-4 border border-amber-200 dark:border-amber-800/30 shadow-inner">
                    <i class="ph-fill ph-fire text-4xl"></i>
                </div>
                <p class="font-bold text-xs uppercase tracking-widest">Chapa Fria</p>
            </div>`; 
        }
    </script>
</body>
</html>
