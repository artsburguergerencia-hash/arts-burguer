<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Anúncios & Promoções | Art's Burguer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], promo: ['Montserrat', 'sans-serif'] }, colors: { brand: { 500: '#ff4757', 600: '#e04050' } } } } };
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
    
    <style>
        .font-promo { font-family: 'Montserrat', sans-serif; }
        .shadow-hard { filter: drop-shadow(0 4px 10px rgba(0,0,0,0.9)); }
        .shadow-glow { filter: drop-shadow(0 0 15px rgba(255, 71, 87, 0.6)); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- CABEÇALHO -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 h-20 px-8 flex items-center justify-between shadow-sm sticky top-0 z-30">
        <div class="flex items-center">
            <div class="w-12 h-12 bg-gradient-to-br from-amber-500 to-brand-500 rounded-2xl flex items-center justify-center text-white mr-4 shadow-lg shadow-brand-500/20">
                <i class="ph-bold ph-megaphone text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tight text-slate-900 dark:text-white leading-none">Estúdio de Marketing & Anúncios</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Gerador de Flyers com Desconto Real</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="baixarImagemCard()" id="btn-baixar" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-6 py-3 rounded-xl shadow-lg transition-transform active:scale-95 uppercase tracking-wider text-xs flex items-center">
                <i class="ph-bold ph-download-simple text-lg mr-2"></i> Baixar Imagem (PNG)
            </button>
            <a href="/gestao" class="bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-red-500 transition-colors">
                <i class="ph-bold ph-sign-out text-lg"></i>
            </a>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- CONTROLES (5 Colunas) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- 1. IMPORTAR DO CARDÁPIO -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2 flex items-center">
                    <i class="ph-bold ph-lightning text-amber-500 mr-2 text-base"></i> 1-Clique: Puxar do seu Cardápio
                </label>
                <select id="sel-cardapio-importar" onchange="importarProdutoSelecionado(this.value)" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:border-brand-500">
                    <option value="">-- Selecione um Lanche Cadastrado --</option>
                </select>
            </div>

            <!-- 2. DESCONTO INTELIGENTE (% E PREÇOS) -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 flex items-center">
                    <i class="ph-bold ph-percent text-emerald-500 mr-2 text-base"></i> Configuração do Desconto
                </label>

                <!-- Escolha do que vai aparecer no flyer -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">O que deve aparecer no Anúncio?</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="flex flex-col items-center p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer text-center hover:border-brand-500 transition-colors">
                            <input type="radio" name="modo_exibicao" value="ambos" checked onchange="atualizarModoExibicao(this.value)" class="sr-only peer">
                            <span class="text-[10px] font-black uppercase tracking-wider peer-checked:text-brand-500">Preço + %</span>
                            <span class="w-2 h-2 rounded-full bg-brand-500 mt-1 opacity-0 peer-checked:opacity-100"></span>
                        </label>
                        <label class="flex flex-col items-center p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer text-center hover:border-brand-500 transition-colors">
                            <input type="radio" name="modo_exibicao" value="preco" onchange="atualizarModoExibicao(this.value)" class="sr-only peer">
                            <span class="text-[10px] font-black uppercase tracking-wider peer-checked:text-brand-500">Só Preço</span>
                            <span class="w-2 h-2 rounded-full bg-brand-500 mt-1 opacity-0 peer-checked:opacity-100"></span>
                        </label>
                        <label class="flex flex-col items-center p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer text-center hover:border-brand-500 transition-colors">
                            <input type="radio" name="modo_exibicao" value="porcentagem" onchange="atualizarModoExibicao(this.value)" class="sr-only peer">
                            <span class="text-[10px] font-black uppercase tracking-wider peer-checked:text-brand-500">Só % OFF</span>
                            <span class="w-2 h-2 rounded-full bg-brand-500 mt-1 opacity-0 peer-checked:opacity-100"></span>
                        </label>
                    </div>
                </div>

                <!-- Inputs sincronizados -->
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Preço (De)</label>
                        <input type="text" id="input-preco-de" value="R$ 8,90" oninput="calcularPorPrecoDe(this.value)" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-red-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-amber-500 uppercase tracking-wider mb-1">Desconto (%)</label>
                        <input type="number" id="input-desconto-pct" value="15" min="1" max="90" oninput="calcularPorPorcentagem(this.value)" class="w-full px-3 py-2.5 bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 rounded-xl text-xs font-black text-amber-600 dark:text-amber-400 outline-none text-center">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-emerald-600 uppercase tracking-wider mb-1">Preço (Por)</label>
                        <input type="text" id="input-preco-por" value="R$ 7,57" oninput="calcularPorPrecoPor(this.value)" class="w-full px-3 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30 rounded-xl text-xs font-black text-emerald-600 outline-none">
                    </div>
                </div>
            </div>

            <!-- 3. TEXTOS & LOGO -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 flex items-center">
                    <i class="ph-bold ph-text-t text-blue-500 mr-2 text-base"></i> Textos da Propaganda
                </label>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Selo Superior</label>
                    <input type="text" id="input-tag" value="🔥 PROMOÇÃO DO DIA" oninput="atualizarPreview()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold outline-none uppercase">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Nome do Lanche / Combo</label>
                    <input type="text" id="input-titulo" value="COCA-COLA NORMAL LATA 350ML" oninput="atualizarPreview()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-black outline-none uppercase">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Chamada do Rodapé</label>
                    <input type="text" id="input-rodape" value="⚡ Peça agora pelo WhatsApp ou Cardápio Online!" oninput="atualizarPreview()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium outline-none">
                </div>

                <!-- Configuração da Logo -->
                <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Exibir Logo da Hamburgueria?</label>
                    <input type="checkbox" id="check-mostrar-logo" checked onchange="toggleLogo(this.checked)" class="w-5 h-5 accent-brand-500 rounded cursor-pointer">
                </div>
            </div>

            <!-- 4. IMAGEM DE FUNDO -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 flex items-center">
                    <i class="ph-bold ph-image text-purple-500 mr-2 text-base"></i> Trocar Foto
                </label>
                <div class="grid grid-cols-4 gap-2">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800&auto=format&fit=crop" onclick="selecionarFotoPronta(this.src)" class="h-14 w-full object-cover rounded-xl border-2 hover:border-brand-500 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1586190848861-99aa4a171e90?q=80&w=800&auto=format&fit=crop" onclick="selecionarFotoPronta(this.src)" class="h-14 w-full object-cover rounded-xl border-2 hover:border-brand-500 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=800&auto=format&fit=crop" onclick="selecionarFotoPronta(this.src)" class="h-14 w-full object-cover rounded-xl border-2 hover:border-brand-500 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?q=80&w=800&auto=format&fit=crop" onclick="selecionarFotoPronta(this.src)" class="h-14 w-full object-cover rounded-xl border-2 hover:border-brand-500 cursor-pointer">
                </div>
                <input type="file" accept="image/*" onchange="subirFotoUsuario(event)" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-brand-500 file:text-white hover:file:bg-brand-600 cursor-pointer pt-2">
            </div>

        </div>

        <!-- PRÉVIA DO ANÚNCIO (7 Colunas) -->
        <div class="lg:col-span-7 flex flex-col items-center sticky top-28">
            <p class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center">
                <i class="ph-bold ph-eye text-emerald-500 mr-2 text-base"></i> Prévia em Alta Resolução
            </p>

            <!-- 🚨 FLYER PROFISSIONAL: ESPAÇO RESPONSIVO ANTI-CORTE 🚨 -->
            <div id="card-anuncio" class="w-[480px] h-[520px] bg-slate-950 rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col justify-between p-6 pb-6 border-4 border-amber-400">
                
                <!-- Imagem com degradê escurecido nas bordas para contraste perfeito -->
                <img id="card-img-fundo" src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-65 pointer-events-none">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-black/70 pointer-events-none"></div>

                <!-- TOPO: SELO DE CHAMADA E LOGO DA LOJA -->
                <div class="relative z-10 flex items-start justify-between">
                    <span id="card-tag" class="bg-gradient-to-r from-red-600 to-amber-500 text-white font-promo font-black text-xs px-4 py-2 rounded-full shadow-lg tracking-widest uppercase border border-white/80">
                        🔥 PROMOÇÃO DO DIA
                    </span>

                    <!-- Logo oficial -->
                    <div id="card-logo-box" class="w-16 h-16 rounded-2xl bg-white/95 p-1.5 border-2 border-amber-400 shadow-xl flex items-center justify-center shrink-0">
                        <img id="card-logo-img" src="" class="w-full h-full object-contain hidden">
                        <i id="card-logo-fallback" class="ph-fill ph-hamburger text-3xl text-brand-500"></i>
                    </div>
                </div>

                <!-- RODAPÉ: TÍTULO, PREÇOS E SELO DE % (SEM NENHUM CORTE) -->
                <div class="relative z-10 flex flex-col justify-end space-y-3">
                    
                    <!-- Selo de % Flutuante (Aparece se o modo for 'ambos' ou 'porcentagem') -->
                    <div id="card-badge-pct-container" class="flex items-center">
                        <span id="card-badge-pct" class="bg-red-600 text-yellow-300 font-promo font-black text-sm px-3.5 py-1 rounded-xl shadow-lg border-2 border-yellow-300 transform -rotate-2">
                            ⚡ 15% DE DESCONTO
                        </span>
                    </div>

                    <!-- Título com espaçamento ajustado -->
                    <h2 id="card-titulo" class="font-promo font-black text-3xl text-white uppercase tracking-tight leading-tight shadow-hard">
                        COCA-COLA NORMAL LATA 350ML
                    </h2>

                    <!-- Bloco de Preços -->
                    <div id="card-bloco-precos" class="flex items-center space-x-3">
                        <div id="card-box-de" class="bg-black/70 backdrop-blur-md px-3.5 py-1.5 rounded-xl border border-white/20">
                            <span class="text-[9px] font-bold text-slate-300 uppercase block leading-none">De:</span>
                            <span id="card-preco-de" class="text-xs font-black text-red-400 line-through tracking-tight">R$ 8,90</span>
                        </div>

                        <div id="card-box-por" class="bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 px-5 py-2 rounded-2xl shadow-xl flex items-center border-2 border-white transform -rotate-1">
                            <span class="text-[11px] font-black uppercase tracking-widest mr-1.5">POR</span>
                            <span id="card-preco-por" class="font-promo font-black text-2xl tracking-tight">R$ 7,57</span>
                        </div>
                    </div>

                    <!-- Barra de Rodapé com margem segura anti-corte -->
                    <div class="bg-black/80 backdrop-blur-md border border-white/20 px-4 py-2 rounded-xl text-center">
                        <p id="card-rodape" class="text-[11px] font-bold text-amber-300 uppercase tracking-wider truncate">
                            ⚡ Peça agora pelo WhatsApp ou Cardápio Online!
                        </p>
                    </div>
                </div>

            </div>

            <button onclick="copiarTextoZap()" class="mt-4 text-xs font-bold text-slate-500 hover:text-emerald-500 flex items-center transition-colors">
                <i class="ph-bold ph-copy mr-1.5 text-base"></i> Copiar texto para colar no WhatsApp junto com a imagem
            </button>
        </div>

    </main>

    <script>
        let produtosCatalogo = [];
        let modoExibicaoAtual = "ambos";

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarConfiguracoesLoja();
            await carregarProdutosCardapio();
            atualizarPreview();
        });

        // Puxa a Logo Oficial do Banco e injeta na prévia
        async function carregarConfiguracoesLoja() {
            try {
                const res = await fetch('/api/gestao/configuracoes');
                const config = await res.json();
                if(config.logo_url && config.logo_url.trim() !== '') {
                    const img = document.getElementById('card-logo-img');
                    img.src = config.logo_url;
                    img.crossOrigin = "anonymous";
                    img.classList.remove('hidden');
                    document.getElementById('card-logo-fallback').classList.add('hidden');
                }
            } catch(e) {}
        }

        async function carregarProdutosCardapio() {
            try {
                const res = await fetch('/api/cardapio');
                produtosCatalogo = await res.json();
                const sel = document.getElementById('sel-cardapio-importar');
                sel.innerHTML = '<option value="">-- Selecione um Lanche Cadastrado --</option>' + 
                    produtosCatalogo.map(p => `<option value="${p.id}">${p.nome} - R$ ${p.preco_venda.toFixed(2).replace('.',',')}</option>`).join('');
            } catch(e) {}
        }

        function parseMoeda(str) {
            if(!str) return 0;
            return parseFloat(str.replace('R$', '').replace(/\./g, '').replace(',', '.').trim()) || 0;
        }

        function formatarMoeda(val) {
            return `R$ ${val.toFixed(2).replace('.', ',')}`;
        }

        // 1-Clique: Puxa o produto e aplica a % atual
        function importarProdutoSelecionado(prodId) {
            if(!prodId) return;
            const p = produtosCatalogo.find(x => x.id === parseInt(prodId));
            if(!p) return;

            document.getElementById('input-titulo').value = p.nome.toUpperCase();
            document.getElementById('input-preco-de').value = formatarMoeda(p.preco_venda);
            
            const pct = parseFloat(document.getElementById('input-desconto-pct').value) || 15;
            const precoFinal = p.preco_venda * (1 - (pct / 100));
            document.getElementById('input-preco-por').value = formatarMoeda(precoFinal);

            if(p.imagem_url && p.imagem_url.trim() !== '') {
                document.getElementById('card-img-fundo').src = p.imagem_url;
            }
            atualizarPreview();
        }

        // Cálculos Sincronizados Bidirecionais
        function calcularPorPorcentagem(pctStr) {
            const pct = parseFloat(pctStr) || 0;
            const precoDe = parseMoeda(document.getElementById('input-preco-de').value);
            if(precoDe > 0) {
                const precoPor = precoDe * (1 - (pct / 100));
                document.getElementById('input-preco-por').value = formatarMoeda(precoPor);
            }
            atualizarPreview();
        }

        function calcularPorPrecoPor(porStr) {
            const precoPor = parseMoeda(porStr);
            const precoDe = parseMoeda(document.getElementById('input-preco-de').value);
            if(precoDe > 0 && precoPor > 0 && precoPor < precoDe) {
                const pct = ((precoDe - precoPor) / precoDe) * 100;
                document.getElementById('input-desconto-pct').value = Math.round(pct);
            }
            atualizarPreview();
        }

        function calcularPorPrecoDe(deStr) {
            const precoDe = parseMoeda(deStr);
            const pct = parseFloat(document.getElementById('input-desconto-pct').value) || 0;
            if(precoDe > 0) {
                const precoPor = precoDe * (1 - (pct / 100));
                document.getElementById('input-preco-por').value = formatarMoeda(precoPor);
            }
            atualizarPreview();
        }

        function atualizarModoExibicao(modo) {
            modoExibicaoAtual = modo;
            const containerBadge = document.getElementById('card-badge-pct-container');
            const blocoPrecos = document.getElementById('card-bloco-precos');

            if(modo === 'ambos') {
                containerBadge.classList.remove('hidden');
                blocoPrecos.classList.remove('hidden');
            } else if(modo === 'preco') {
                containerBadge.classList.add('hidden');
                blocoPrecos.classList.remove('hidden');
            } else if(modo === 'porcentagem') {
                containerBadge.classList.remove('hidden');
                blocoPrecos.classList.add('hidden');
            }
        }

        function toggleLogo(mostrar) {
            document.getElementById('card-logo-box').style.display = mostrar ? 'flex' : 'none';
        }

        function selecionarFotoPronta(url) {
            document.getElementById('card-img-fundo').src = url;
        }

        function subirFotoUsuario(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    document.getElementById('card-img-fundo').src = reader.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function atualizarPreview() {
            document.getElementById('card-tag').innerText = document.getElementById('input-tag').value.toUpperCase();
            document.getElementById('card-titulo').innerText = document.getElementById('input-titulo').value.toUpperCase();
            document.getElementById('card-preco-de').innerText = document.getElementById('input-preco-de').value;
            document.getElementById('card-preco-por').innerText = document.getElementById('input-preco-por').value;
            document.getElementById('card-rodape').innerText = document.getElementById('input-rodape').value;
            
            const pct = document.getElementById('input-desconto-pct').value;
            document.getElementById('card-badge-pct').innerText = `⚡ ${pct}% DE DESCONTO`;
        }

        // 🚨 BAIXAR A IMAGEM EM ALTA RESOLUÇÃO SEM CORTE 🚨
        function baixarImagemCard() {
            const card = document.getElementById('card-anuncio');
            const btn = document.getElementById('btn-baixar');
            const txtOriginal = btn.innerHTML;
            
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg mr-2"></i> Renderizando...';
            btn.disabled = true;

            // Garante o carregamento das fontes antes de converter para imagem
            document.fonts.ready.then(() => {
                html2canvas(card, {
                    scale: 3, // Resolução 3x ultra-nítida para WhatsApp
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: null,
                    scrollX: 0,
                    scrollY: 0
                }).then(canvas => {
                    const link = document.createElement('a');
                    const nomeArquivo = document.getElementById('input-titulo').value.replace(/[^a-zA-Z0-9]/g, '_');
                    link.download = `Promo_${nomeArquivo}.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.click();
                    
                    btn.innerHTML = '<i class="ph-bold ph-check mr-2 text-lg"></i> Imagem Baixada!';
                    setTimeout(() => { btn.innerHTML = txtOriginal; btn.disabled = false; }, 2000);
                }).catch(err => {
                    alert("Falha ao gerar imagem.");
                    btn.innerHTML = txtOriginal; btn.disabled = false;
                });
            });
        }

        function copiarTextoZap() {
            const tag = document.getElementById('input-tag').value;
            const tit = document.getElementById('input-titulo').value;
            const de = document.getElementById('input-preco-de').value;
            const por = document.getElementById('input-preco-por').value;
            const pct = document.getElementById('input-desconto-pct').value;
            
            let linhaPreco = "";
            if(modoExibicaoAtual === 'ambos') {
                linhaPreco = `🔥 Desconto de ${pct}%\n❌ De: ${de}\n✅ *Por apenas: ${por}!*`;
            } else if(modoExibicaoAtual === 'preco') {
                linhaPreco = `❌ De: ${de}\n✅ *Por apenas: ${por}!*`;
            } else {
                linhaPreco = `⚡ *SUPER DESCONTO DE ${pct}% OFF!*`;
            }

            const msg = `${tag}\n\n🍔 *${tit}*\n${linhaPreco}\n\n👉 Peça agora pelo nosso cardápio digital ou responda essa mensagem!`;
            navigator.clipboard.writeText(msg);
            alert("Texto copiado! 📋\nCole no WhatsApp junto com a imagem baixada.");
        }
    </script>
</body>
</html>
