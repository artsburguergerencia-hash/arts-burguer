<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Anúncios & Promoções | Art's Burguer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Biblioteca de conversão de HTML para Imagem PNG em Alta Resolução -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], promo: ['Montserrat', 'sans-serif'] }, colors: { brand: { 500: '#ff4757', 600: '#e04050' } } } } };
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
    
    <style>
        .font-promo { font-family: 'Montserrat', sans-serif; }
        .text-stroke { -webkit-text-stroke: 2px #000; }
        .text-stroke-white { -webkit-text-stroke: 1.5px #fff; }
        .shadow-hard { filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.8)); }
        .shadow-glow { filter: drop-shadow(0 0 20px rgba(255, 71, 87, 0.6)); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- CABEÇALHO -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 h-20 px-8 flex items-center justify-between shadow-sm sticky top-0 z-30">
        <div class="flex items-center">
            <div class="w-12 h-12 bg-gradient-to-br from-amber-500 to-brand-500 rounded-2xl flex items-center justify-center text-white mr-4 shadow-lg shadow-brand-500/20">
                <i class="ph-bold ph-megaphone text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tight text-slate-900 dark:text-white leading-none">Estúdio de Marketing & Anúncios</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Gerador de Flyers para WhatsApp & Instagram</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="baixarImagemCard()" id="btn-baixar" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-6 py-3 rounded-xl shadow-lg transition-transform active:scale-95 uppercase tracking-wider text-xs flex items-center">
                <i class="ph-bold ph-download-simple text-lg mr-2"></i> Baixar Imagem (PNG)
            </button>
            <a href="/gestao" class="bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-red-500 transition-colors">
                <i class="ph-bold ph-sign-out text-lg"></i>
            </a>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL DIVIDIDA EM 2 COLUNAS -->
    <main class="flex-1 p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- COLUNA ESQUERDA: CONTROLES & PERSONALIZAÇÃO (5 Colunas) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- 1. ATALHO: IMPORTAR DO PRÓPRIO CARDÁPIO -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2 flex items-center">
                    <i class="ph-bold ph-lightning text-amber-500 mr-2 text-base"></i> 1-Clique: Puxar do seu Cardápio
                </label>
                <select id="sel-cardapio-importar" onchange="importarProdutoSelecionado(this.value)" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:border-brand-500">
                    <option value="">-- Selecione um Lanche Cadastrado --</option>
                </select>
            </div>

            <!-- 2. ESCOLHA DA IMAGEM -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 flex items-center">
                    <i class="ph-bold ph-image text-brand-500 mr-2 text-base"></i> Imagem do Anúncio
                </label>
                
                <!-- Galeria de Fotos Prontas de Alta Qualidade -->
                <div>
                    <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Ou escolha uma foto de alta definição pronta:</p>
                    <div class="grid grid-cols-4 gap-2">
                        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800&auto=format&fit=crop" onclick="selecionarFotoPronta(this.src)" class="h-16 w-full object-cover rounded-xl border-2 border-transparent hover:border-brand-500 cursor-pointer shadow-sm active:scale-95 transition-all">
                        <img src="https://images.unsplash.com/photo-1586190848861-99aa4a171e90?q=80&w=800&auto=format&fit=crop" onclick="selecionarFotoPronta(this.src)" class="h-16 w-full object-cover rounded-xl border-2 border-transparent hover:border-brand-500 cursor-pointer shadow-sm active:scale-95 transition-all">
                        <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=800&auto=format&fit=crop" onclick="selecionarFotoPronta(this.src)" class="h-16 w-full object-cover rounded-xl border-2 border-transparent hover:border-brand-500 cursor-pointer shadow-sm active:scale-95 transition-all">
                        <img src="https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?q=80&w=800&auto=format&fit=crop" onclick="selecionarFotoPronta(this.src)" class="h-16 w-full object-cover rounded-xl border-2 border-transparent hover:border-brand-500 cursor-pointer shadow-sm active:scale-95 transition-all">
                    </div>
                </div>

                <!-- Upload do Celular / Computador -->
                <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
                    <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Subir Foto do Celular / Galeria</label>
                    <input type="file" accept="image/*" onchange="subirFotoUsuario(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-brand-500 file:text-white hover:file:bg-brand-600 cursor-pointer">
                </div>
            </div>

            <!-- 3. TEXTOS DA PROPAGANDA -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 flex items-center">
                    <i class="ph-bold ph-text-t text-blue-500 mr-2 text-base"></i> Textos da Propaganda
                </label>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Selo / Chamada de Topo</label>
                    <input type="text" id="input-tag" value="🔥 PROMOÇÃO DO DIA" oninput="atualizarPreview()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold outline-none uppercase">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Título do Lanche / Combo</label>
                    <input type="text" id="input-titulo" value="2 ART'S BACON BURGER" oninput="atualizarPreview()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-black outline-none uppercase">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Preço Normal (De)</label>
                        <input type="text" id="input-preco-de" value="R$ 30,00" oninput="atualizarPreview()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-red-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-emerald-600 uppercase tracking-wider mb-1">Preço Promoção (Por)</label>
                        <input type="text" id="input-preco-por" value="R$ 20,00" oninput="atualizarPreview()" class="w-full px-4 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30 rounded-xl text-sm font-black text-emerald-600 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Chamada para Ação / Rodapé</label>
                    <input type="text" id="input-rodape" value="⚡ Peça agora pelo WhatsApp ou Cardápio Online!" oninput="atualizarPreview()" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Estilo do Tema</label>
                        <select id="sel-tema" onchange="atualizarTema(this.value)" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold outline-none">
                            <option value="brasa">Chapa & Fogo (Escuro)</option>
                            <option value="fastfood">Ouro & Amarelo Fast-Food</option>
                            <option value="neon">Neon Noturno (Cyber)</option>
                            <option value="clean">Artesanal Clean</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Formato</label>
                        <select id="sel-formato" onchange="atualizarFormato(this.value)" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold outline-none">
                            <option value="quadrado">Quadrado (1:1 - WhatsApp)</option>
                            <option value="stories">Vertical (9:16 - Status/Stories)</option>
                        </select>
                    </div>
                </div>
            </div>

        </div>

        <!-- COLUNA DIREITA: PREVIEW DO ANÚNCIO AO VIVO (7 Colunas) -->
        <div class="lg:col-span-7 flex flex-col items-center sticky top-28">
            <p class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center">
                <i class="ph-bold ph-eye text-emerald-500 mr-2 text-base"></i> Prévia do Anúncio (Ao Vivo)
            </p>

            <!-- 🚨 O CANVAS / CARD DO ANÚNCIO (FORMATADO COMO FLYER DE PROPAGANDA) 🚨 -->
            <div id="card-anuncio" class="w-[480px] h-[480px] bg-slate-900 rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col justify-between p-8 border-4 border-amber-400/80 transition-all">
                
                <!-- Imagem de Fundo com Fade de Fumaça/Gradiente -->
                <img id="card-img-fundo" src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-60 pointer-events-none transform scale-105">
                <div id="card-overlay" class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/70 pointer-events-none"></div>

                <!-- TOPO: SELO DE IMPACTO E LOGO -->
                <div class="relative z-10 flex items-center justify-between">
                    <span id="card-tag" class="bg-gradient-to-r from-red-600 to-amber-500 text-white font-promo font-black text-sm px-4 py-1.5 rounded-full shadow-lg tracking-widest uppercase border-2 border-white/80 animate-pulse">
                        🔥 PROMOÇÃO DO DIA
                    </span>

                    <!-- Logo Oficial da Loja -->
                    <div id="card-logo-container" class="w-14 h-14 rounded-2xl bg-white p-1 border-2 border-amber-400 shadow-xl overflow-hidden flex items-center justify-center">
                        <img id="card-logo-img" src="" class="w-full h-full object-contain hidden">
                        <i id="card-logo-fallback" class="ph-fill ph-hamburger text-3xl text-brand-500"></i>
                    </div>
                </div>

                <!-- CENTRO / RODAPÉ: TÍTULO GIGANTE E PREÇOS DE PROPAGANDA -->
                <div class="relative z-10 space-y-3 mt-auto">
                    
                    <!-- Título em Destaque com Sombra Pesada -->
                    <h2 id="card-titulo" class="font-promo font-black text-4xl text-white uppercase tracking-tighter leading-none shadow-hard drop-shadow-[0_4px_8px_rgba(0,0,0,0.9)]">
                        2 ART'S BACON BURGER
                    </h2>

                    <!-- BLOCO DE PREÇOS ESTILO VAREJO / FAST FOOD -->
                    <div class="flex items-center space-x-3 pt-1">
                        <div class="bg-black/60 backdrop-blur-md px-3 py-1 rounded-xl border border-white/20">
                            <span class="text-[10px] font-bold text-slate-300 uppercase block leading-none">De:</span>
                            <span id="card-preco-de" class="text-sm font-black text-red-400 line-through tracking-tight">R$ 30,00</span>
                        </div>

                        <div class="bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 px-5 py-2 rounded-2xl shadow-xl flex items-center border-2 border-white transform -rotate-1 shadow-glow">
                            <span class="text-xs font-black uppercase tracking-widest mr-1.5">POR</span>
                            <span id="card-preco-por" class="font-promo font-black text-3xl tracking-tighter">R$ 20,00</span>
                        </div>
                    </div>

                    <!-- Rodapé / Chamada de Ação -->
                    <div class="bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2 rounded-xl text-center">
                        <p id="card-rodape" class="text-xs font-bold text-amber-300 uppercase tracking-wider truncate">
                            ⚡ Peça agora pelo WhatsApp ou Cardápio Online!
                        </p>
                    </div>
                </div>

            </div>

            <!-- Botão auxiliar de copiar texto do WhatsApp -->
            <button onclick="copiarTextoZap()" class="mt-4 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-emerald-500 flex items-center transition-colors">
                <i class="ph-bold ph-copy mr-1.5 text-base"></i> Copiar texto pronto para colar no WhatsApp junto com a imagem
            </button>
        </div>

    </main>

    <script>
        let produtosCatalogo = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarConfiguracoesLoja();
            await carregarProdutosCardapio();
            atualizarPreview();
        });

        // Puxa a Logo Oficial da Hamburgueria do Banco
        async function carregarConfiguracoesLoja() {
            try {
                const res = await fetch('/api/gestao/configuracoes');
                const config = await res.json();
                if(config.logo_url && config.logo_url.trim() !== '') {
                    const img = document.getElementById('card-logo-img');
                    img.src = config.logo_url;
                    img.classList.remove('hidden');
                    document.getElementById('card-logo-fallback').classList.add('hidden');
                }
            } catch(e) {}
        }

        // Puxa os Produtos do Cardápio para o 1-Clique
        async function carregarProdutosCardapio() {
            try {
                const res = await fetch('/api/cardapio');
                produtosCatalogo = await res.json();
                const sel = document.getElementById('sel-cardapio-importar');
                sel.innerHTML = '<option value="">-- Escolher do seu Cardápio --</option>' + 
                    produtosCatalogo.map(p => `<option value="${p.id}">${p.nome} - R$ ${p.preco_venda.toFixed(2).replace('.',',')}</option>`).join('');
            } catch(e) {}
        }

        // 1-Clique: Preenche o flyer com dados do lanche
        function importarProdutoSelecionado(prodId) {
            if(!prodId) return;
            const p = produtosCatalogo.find(x => x.id === parseInt(prodId));
            if(!p) return;

            document.getElementById('input-titulo').value = p.nome.toUpperCase();
            
            // Sugestão de Preço Promocional (15% de desconto automático)
            const precoNormal = p.preco_venda;
            const precoPromo = precoNormal * 0.85;
            
            document.getElementById('input-preco-de').value = `R$ ${precoNormal.toFixed(2).replace('.', ',')}`;
            document.getElementById('input-preco-por').value = `R$ ${precoPromo.toFixed(2).replace('.', ',')}`;
            
            if(p.imagem_url && p.imagem_url.trim() !== '') {
                document.getElementById('card-img-fundo').src = p.imagem_url;
            }
            atualizarPreview();
        }

        function selecionarFotoPronta(url) {
            document.getElementById('card-img-fundo').src = url;
        }

        function subirFotoUsuario(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    document.getElementById('card-img-fundo').src = reader.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Atualização em Tempo Real na Prévia
        function atualizarPreview() {
            document.getElementById('card-tag').innerText = document.getElementById('input-tag').value.toUpperCase();
            document.getElementById('card-titulo').innerText = document.getElementById('input-titulo').value.toUpperCase();
            document.getElementById('card-preco-de').innerText = document.getElementById('input-preco-de').value;
            document.getElementById('card-preco-por').innerText = document.getElementById('input-preco-por').value;
            document.getElementById('card-rodape').innerText = document.getElementById('input-rodape').value;
        }

        // Muda as Cores e Estilo do Card
        function atualizarTema(tema) {
            const card = document.getElementById('card-anuncio');
            const overlay = document.getElementById('card-overlay');
            const tag = document.getElementById('card-tag');
            
            if(tema === 'brasa') {
                card.className = "w-[480px] h-[480px] bg-slate-900 rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col justify-between p-8 border-4 border-amber-400/80 transition-all";
                overlay.className = "absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/70 pointer-events-none";
                tag.className = "bg-gradient-to-r from-red-600 to-amber-500 text-white font-promo font-black text-sm px-4 py-1.5 rounded-full shadow-lg tracking-widest uppercase border-2 border-white/80 animate-pulse";
            } else if(tema === 'fastfood') {
                card.className = "w-[480px] h-[480px] bg-red-700 rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col justify-between p-8 border-4 border-yellow-400 transition-all";
                overlay.className = "absolute inset-0 bg-gradient-to-t from-red-950 via-red-900/40 to-black/60 pointer-events-none";
                tag.className = "bg-yellow-400 text-slate-950 font-promo font-black text-sm px-4 py-1.5 rounded-full shadow-lg tracking-widest uppercase border-2 border-white";
            } else if(tema === 'neon') {
                card.className = "w-[480px] h-[480px] bg-purple-950 rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col justify-between p-8 border-4 border-cyan-400 transition-all shadow-[0_0_30px_rgba(6,182,212,0.4)]";
                overlay.className = "absolute inset-0 bg-gradient-to-t from-purple-950 via-black/50 to-cyan-950/40 pointer-events-none";
                tag.className = "bg-cyan-400 text-slate-950 font-promo font-black text-sm px-4 py-1.5 rounded-full shadow-lg tracking-widest uppercase border-2 border-white";
            } else if(tema === 'clean') {
                card.className = "w-[480px] h-[480px] bg-stone-900 rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col justify-between p-8 border-4 border-emerald-400 transition-all";
                overlay.className = "absolute inset-0 bg-gradient-to-t from-stone-950 via-stone-900/40 to-black/50 pointer-events-none";
                tag.className = "bg-emerald-500 text-white font-promo font-black text-sm px-4 py-1.5 rounded-full shadow-lg tracking-widest uppercase border-2 border-white";
            }
        }

        // Alterna entre Formato Quadrado e Formato Stories (Status WhatsApp)
        function atualizarFormato(formato) {
            const card = document.getElementById('card-anuncio');
            if(formato === 'stories') {
                card.style.width = '360px';
                card.style.height = '640px'; // Proporção 9:16
            } else {
                card.style.width = '480px';
                card.style.height = '480px'; // Proporção 1:1
            }
        }

        // 🚨 BAIXAR O CARD COMO IMAGEM PNG EM ALTA DEFINIÇÃO 🚨
        function baixarImagemCard() {
            const card = document.getElementById('card-anuncio');
            const btn = document.getElementById('btn-baixar');
            const txtOriginal = btn.innerHTML;
            
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg mr-2"></i> Renderizando Imagem...';
            btn.disabled = true;

            html2canvas(card, {
                scale: 2.5, // Gera a imagem em dobro da resolução para não pixelar no WhatsApp
                useCORS: true, // Permite baixar com fotos externas
                allowTaint: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Anuncio_${document.getElementById('input-titulo').value.replace(/\s+/g, '_')}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerHTML = '<i class="ph-bold ph-check mr-2 text-lg"></i> Imagem Baixada!';
                setTimeout(() => { btn.innerHTML = txtOriginal; btn.disabled = false; }, 2000);
            }).catch(err => {
                alert("Erro ao gerar imagem. Tente novamente.");
                btn.innerHTML = txtOriginal; btn.disabled = false;
            });
        }

        // Copia a Mensagem do WhatsApp com Emojis
        function copiarTextoZap() {
            const tag = document.getElementById('input-tag').value;
            const tit = document.getElementById('input-titulo').value;
            const de = document.getElementById('input-preco-de').value;
            const por = document.getElementById('input-preco-por').value;
            
            const msg = `${tag}\n\n🍔 *${tit}*\n❌ De: ${de}\n✅ *Por apenas: ${por}!*\n\n👉 Peça agora pelo nosso cardápio digital ou responda essa mensagem! 🔥`;
            navigator.clipboard.writeText(msg);
            alert("Texto copiado! 📋\nBasta colar no WhatsApp junto com a foto que você baixou.");
        }
    </script>
</body>
</html>
