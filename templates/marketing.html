<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art's Creative Studio Pro | Canva & Story Maker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Engine Gráfica de Canvas Profissional (Fabric.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        promo: ['Montserrat', 'sans-serif'],
                        cake: ['Playfair Display', 'serif']
                    }, 
                    colors: { brand: { 500: '#ff4757', 600: '#e04050' }, cake: { 500: '#ec4899', 600: '#db2777' } } 
                } 
            } 
        };
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
    
    <style>
        .tab-btn.active { border-color: #ff4757; color: #ff4757; background: rgba(255, 71, 87, 0.08); }
        .canvas-container { margin: 0 auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border-radius: 2rem; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- 🚨 CABEÇALHO COM A SUA LOGO OFICIAL DINÂMICA 🚨 -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 h-20 px-8 flex items-center justify-between shadow-sm sticky top-0 z-30">
        <div class="flex items-center">
            <div id="header-logo-container" class="w-12 h-12 rounded-2xl bg-white border border-slate-200 dark:border-slate-700 flex items-center justify-center mr-4 shadow-md overflow-hidden shrink-0">
                <img id="header-logo-img" src="" class="w-full h-full object-cover hidden">
                <i id="header-logo-letra" class="ph-bold ph-storefront text-2xl text-brand-500"></i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tight text-slate-900 dark:text-white leading-none" id="header-nome-loja">Art's Creative Studio Pro</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Editor Visual Livre (Imagens & Vídeos Animados)</p>
            </div>
        </div>

        <!-- AÇÕES DE DOWNLOAD -->
        <div class="flex items-center space-x-3">
            <button onclick="gerarVideoAnimado()" id="btn-video" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-black px-5 py-3 rounded-xl shadow-lg transition-transform active:scale-95 uppercase tracking-wider text-xs flex items-center">
                <i class="ph-bold ph-video-camera text-lg mr-2"></i> Criar Vídeo Animado (Status)
            </button>
            <button onclick="baixarImagemPNG()" id="btn-baixar" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-6 py-3 rounded-xl shadow-lg transition-transform active:scale-95 uppercase tracking-wider text-xs flex items-center">
                <i class="ph-bold ph-download-simple text-lg mr-2"></i> Baixar Imagem (PNG)
            </button>
            <a href="/gestao" class="bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-red-500 transition-colors">
                <i class="ph-bold ph-sign-out text-lg"></i>
            </a>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL DIVIDIDA EM 2 COLUNAS -->
    <main class="flex-1 p-6 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- COLUNA ESQUERDA: FERRAMENTAS DO ESTÚDIO (5 Colunas) -->
        <div class="lg:col-span-5 space-y-5">
            
            <!-- ABAS DE NAVEGAÇÃO -->
            <div class="bg-white dark:bg-slate-900 p-2 rounded-2xl border border-slate-200 dark:border-slate-800 grid grid-cols-4 gap-1 text-center shadow-sm">
                <button onclick="mudarAba('produto', this)" class="tab-btn active py-2 rounded-xl text-[10px] font-black uppercase tracking-wider border-2 border-transparent transition-all">Item</button>
                <button onclick="mudarAba('foto', this)" class="tab-btn py-2 rounded-xl text-[10px] font-black uppercase tracking-wider border-2 border-transparent transition-all">Foto & Zoom</button>
                <button onclick="mudarAba('edicao', this)" class="tab-btn py-2 rounded-xl text-[10px] font-black uppercase tracking-wider border-2 border-transparent transition-all">Retoque</button>
                <button onclick="mudarAba('marca', this)" class="tab-btn py-2 rounded-xl text-[10px] font-black uppercase tracking-wider border-2 border-transparent transition-all">Marca</button>
            </div>

            <!-- PAINEL 1: PRODUTO & PREÇOS -->
            <div id="painel-produto" class="space-y-4">
                <!-- 1-Clique do Cardápio -->
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 flex items-center">
                        <i class="ph-bold ph-lightning text-amber-500 mr-1.5 text-base"></i> Puxar do seu Cardápio
                    </label>
                    <select id="sel-cardapio" onchange="importarDoCardapio(this.value)" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-700 dark:text-white outline-none">
                        <option value="">-- Selecione um Lanche ou Doce --</option>
                    </select>
                </div>

                <!-- Textos e Preços -->
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Título da Oferta</label>
                        <input type="text" id="inp-titulo" value="BOLO SUPREME: NINHO, MARACUJÁ & PUDIM" oninput="atualizarTextoObjeto('titulo', this.value)" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-black uppercase outline-none">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Selo Superior</label>
                        <input type="text" id="inp-selo" value="🔥 PROMOÇÃO DO DIA" oninput="atualizarTextoObjeto('selo', this.value)" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold uppercase outline-none">
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Preço Normal (De)</label>
                            <input type="text" id="inp-de" value="R$ 14,90" oninput="sincronizarPreco('de', this.value)" class="w-full px-2 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-red-500 text-center outline-none">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-amber-500 uppercase mb-1">Desconto (%)</label>
                            <input type="number" id="inp-pct" value="20" min="1" max="90" oninput="sincronizarPreco('pct', this.value)" class="w-full px-2 py-2 bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 rounded-xl text-xs font-black text-amber-600 text-center outline-none">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-emerald-600 uppercase mb-1">Preço Promo (Por)</label>
                            <input type="text" id="inp-por" value="R$ 11,92" oninput="sincronizarPreco('por', this.value)" class="w-full px-2 py-2 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30 rounded-xl text-xs font-black text-emerald-600 text-center outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Rodapé Chamada</label>
                        <input type="text" id="inp-rodape" value="⚡ PEÇA AGORA PELO CARDÁPIO ONLINE!" oninput="atualizarTextoObjeto('rodape', this.value)" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium outline-none">
                    </div>

                    <!-- Modo de Exibição do Preço -->
                    <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
                        <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Como quer exibir o preço?</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="definirModoPreco('ambos')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-[9px] font-black uppercase hover:border-brand-500 border border-transparent" id="btn-modo-ambos">Preço + %</button>
                            <button onclick="definirModoPreco('preco')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-[9px] font-black uppercase hover:border-brand-500 border border-transparent" id="btn-modo-preco">Só Preço</button>
                            <button onclick="definirModoPreco('pct')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-[9px] font-black uppercase hover:border-brand-500 border border-transparent" id="btn-modo-pct">Só % OFF</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PAINEL 2: FOTO, ZOOM E POSIÇÃO -->
            <div id="painel-foto" class="hidden space-y-4">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Subir Foto do Lanche ou Doce</label>
                        <input type="file" accept="image/*" onchange="carregarFotoCustomizada(event)" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-brand-500 file:text-white cursor-pointer">
                    </div>

                    <!-- Controle de Zoom e Posição da Foto -->
                    <div class="space-y-3 pt-2 border-t border-slate-100 dark:border-slate-800">
                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                                <span>Zoom da Foto</span><span id="lbl-zoom">100%</span>
                            </div>
                            <input type="range" id="rng-zoom" min="40" max="250" value="100" oninput="ajustarZoomFoto(this.value)" class="w-full accent-brand-500">
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="moverFoto('cima')" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold flex items-center justify-center"><i class="ph-bold ph-arrow-up mr-1"></i> Subir Foto</button>
                            <button onclick="moverFoto('baixo')" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold flex items-center justify-center"><i class="ph-bold ph-arrow-down mr-1"></i> Descer Foto</button>
                            <button onclick="moverFoto('esq')" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold flex items-center justify-center"><i class="ph-bold ph-arrow-left mr-1"></i> Esquerda</button>
                            <button onclick="moverFoto('dir')" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold flex items-center justify-center"><i class="ph-bold ph-arrow-right mr-1"></i> Direita</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PAINEL 3: RETOQUE, BORRACHA E FILTROS INSTAGRAM -->
            <div id="painel-edicao" class="hidden space-y-4">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                    <!-- Ferramenta de Borracha / Pincel -->
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 flex items-center">
                            <i class="ph-bold ph-eraser text-amber-500 mr-1.5 text-base"></i> Pincel de Retoque / Borracha
                        </label>
                        <div class="flex space-x-2">
                            <button onclick="ativarModoPintura(true)" id="btn-pincel" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-black uppercase tracking-wider hover:bg-brand-500 hover:text-white transition-all flex items-center justify-center">
                                <i class="ph-bold ph-paint-brush mr-1.5 text-base"></i> Ativar Pincel
                            </button>
                            <button onclick="ativarModoPintura(false)" class="px-4 py-2.5 bg-slate-200 dark:bg-slate-700 rounded-xl text-xs font-black uppercase">
                                Parar
                            </button>
                        </div>
                        <div class="flex items-center space-x-3 mt-3">
                            <label class="text-[10px] font-bold text-slate-400 uppercase">Tamanho:</label>
                            <input type="range" id="rng-pincel-tam" min="5" max="60" value="20" oninput="mudarTamanhoPincel(this.value)" class="flex-1 accent-amber-500">
                            <input type="color" id="cor-pincel" value="#ffffff" onchange="mudarCorPincel(this.value)" class="w-8 h-8 rounded-lg cursor-pointer border border-slate-200">
                        </div>
                    </div>

                    <!-- Filtros Rápidos Instagram -->
                    <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Filtros Rápidos de Comida</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="aplicarFiltroInstagram('normal')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-[10px] font-black uppercase">Original</button>
                            <button onclick="aplicarFiltroInstagram('cake')" class="p-2 rounded-xl bg-pink-50 dark:bg-pink-500/10 text-pink-600 text-[10px] font-black uppercase">🍰 Doces/Cake</button>
                            <button onclick="aplicarFiltroInstagram('burger')" class="p-2 rounded-xl bg-amber-50 dark:bg-amber-500/10 text-amber-600 text-[10px] font-black uppercase">🔥 Suculento</button>
                            <button onclick="aplicarFiltroInstagram('vivid')" class="p-2 rounded-xl bg-blue-50 dark:bg-blue-500/10 text-blue-600 text-[10px] font-black uppercase">⚡ Vívido</button>
                            <button onclick="aplicarFiltroInstagram('pb')" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-700 text-[10px] font-black uppercase">P & B</button>
                            <button onclick="resetarFiltros()" class="p-2 rounded-xl bg-red-50 text-red-500 text-[10px] font-black uppercase">Resetar</button>
                        </div>
                    </div>

                    <!-- Ajustes Finos de Luz -->
                    <div class="space-y-3 pt-2 border-t border-slate-100 dark:border-slate-800">
                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>Brilho</span><span id="lbl-brilho">0%</span></div>
                            <input type="range" id="rng-brilho" min="-0.5" max="0.5" step="0.05" value="0" oninput="aplicarFiltroManual()" class="w-full accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>Contraste</span><span id="lbl-contraste">0%</span></div>
                            <input type="range" id="rng-contraste" min="-0.5" max="0.5" step="0.05" value="0" oninput="aplicarFiltroManual()" class="w-full accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>Saturação de Cores</span><span id="lbl-saturacao">0%</span></div>
                            <input type="range" id="rng-saturacao" min="-0.8" max="1" step="0.05" value="0" oninput="aplicarFiltroManual()" class="w-full accent-blue-500">
                        </div>
                    </div>
                </div>
            </div>

            <!-- PAINEL 4: MARCA & IDENTIDADE (BURGUER VS CAKE) -->
            <div id="painel-marca" class="hidden space-y-4">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Escolha o Tema do Anúncio</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="selecionarTemaVisual('burguer')" id="btn-tema-burguer" class="p-4 rounded-2xl border-2 border-brand-500 bg-brand-50/50 dark:bg-brand-500/10 text-left transition-all">
                            <div class="w-8 h-8 rounded-xl bg-brand-500 text-white flex items-center justify-center mb-2"><i class="ph-fill ph-hamburger text-lg"></i></div>
                            <h4 class="font-black text-xs text-slate-900 dark:text-white">Art's Burguer</h4>
                            <p class="text-[9px] text-slate-500">Lanches, Burgers & Porções</p>
                        </button>
                        <button onclick="selecionarTemaVisual('cake')" id="btn-tema-cake" class="p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-left hover:border-cake-500 transition-all">
                            <div class="w-8 h-8 rounded-xl bg-cake-500 text-white flex items-center justify-center mb-2"><i class="ph-fill ph-cake text-lg"></i></div>
                            <h4 class="font-black text-xs text-slate-900 dark:text-white">Art's Cake</h4>
                            <p class="text-[9px] text-slate-500">Doces, Bolos & Sobremesas</p>
                        </button>
                    </div>

                    <!-- Upload da Logo para o Flyer -->
                    <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Subir Logo do Flyer (PNG Transparente)</label>
                        <input type="file" accept="image/*" onchange="carregarLogoFlyer(event)" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-slate-900 dark:file:bg-white file:text-white dark:file:text-slate-900 cursor-pointer">
                    </div>
                </div>
            </div>

        </div>

        <!-- COLUNA DIREITA: O CANVAS PROFISSIONAL DRAG-AND-DROP (7 Colunas) -->
        <div class="lg:col-span-7 flex flex-col items-center sticky top-24">
            <div class="flex justify-between items-center w-[480px] mb-2 px-2">
                <span class="text-[11px] font-black uppercase tracking-widest text-slate-400 flex items-center">
                    <i class="ph-bold ph-hand-pointing text-brand-500 mr-1.5 text-base"></i> Arraste os textos para onde quiser!
                </span>
                <span class="text-[10px] font-bold text-emerald-500 bg-emerald-50 dark:bg-emerald-500/10 px-2 py-0.5 rounded-lg border border-emerald-200 dark:border-emerald-500/20">Zero Cortes</span>
            </div>

            <!-- 🚨 O CANVAS NATIVO DO ESTÚDIO (480x600 px) 🚨 -->
            <div class="canvas-container relative border-4 border-amber-400 dark:border-slate-700 bg-black">
                <canvas id="canvas-studio" width="480" height="600"></canvas>
            </div>

            <!-- Ações rápidas de alinhamento -->
            <div class="flex items-center space-x-2 mt-4">
                <button onclick="centralizarElemento()" class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold hover:border-brand-500 shadow-sm flex items-center">
                    <i class="ph-bold ph-align-center-horizontal mr-1 text-sm"></i> Centralizar
                </button>
                <button onclick="trazerFrente()" class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold hover:border-brand-500 shadow-sm flex items-center">
                    <i class="ph-bold ph-stack mr-1 text-sm"></i> Para Frente
                </button>
                <button onclick="copiarLegendaZap()" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30 rounded-xl text-xs font-bold shadow-sm flex items-center">
                    <i class="ph-bold ph-copy mr-1 text-sm"></i> Copiar Legenda WhatsApp
                </button>
            </div>
        </div>

    </main>

    <!-- MOTOR JAVASCRIPT DO CANVAS STUDIO -->
    <script>
        let canvas;
        let imgFundo;
        let objTitulo, objSelo, objDe, objPor, objBadgePct, objRodape, objLogo;
        let produtosCatalogo = [];
        let temaAtual = 'cake'; // Começa com Cake como no print!

        document.addEventListener('DOMContentLoaded', async () => {
            inicializarCanvas();
            await carregarConfiguracoes();
            await carregarCardapio();
            
            // Inicia com o tema Cake para resolver o problema do doce
            selecionarTemaVisual('cake');
        });

        function inicializarCanvas() {
            canvas = new fabric.Canvas('canvas-studio', {
                preserveObjectStacking: true,
                selection: true
            });

            // Carrega foto inicial padrão (Pudim/Bolo Supreme)
            const fotoInicial = "https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=800&auto=format&fit=crop";
            setFotoFundo(fotoInicial);

            // Cria os Elementos Interativos Arrastáveis
            criarElementosCanvas();
        }

        // Puxa a Logo Oficial para o Header e para o Canvas
        async function carregarConfiguracoes() {
            try {
                const res = await fetch('/api/gestao/configuracoes');
                const config = await res.json();
                
                if(config.nome_empresa) {
                    document.getElementById('header-nome-loja').innerText = `${config.nome_empresa} Studio`;
                }
                if(config.logo_url && config.logo_url.trim() !== '') {
                    const img = document.getElementById('header-logo-img');
                    img.src = config.logo_url;
                    img.classList.remove('hidden');
                    document.getElementById('header-logo-letra').classList.add('hidden');

                    // Carrega no Canvas
                    setLogoFlyer(config.logo_url);
                }
            } catch(e) {}
        }

        async function carregarCardapio() {
            try {
                const res = await fetch('/api/cardapio');
                produtosCatalogo = await res.json();
                const sel = document.getElementById('sel-cardapio');
                sel.innerHTML = '<option value="">-- Selecione um Lanche ou Doce --</option>' + 
                    produtosCatalogo.map(p => `<option value="${p.id}">${p.nome} - R$ ${p.preco_venda.toFixed(2).replace('.',',')}</option>`).join('');
            } catch(e) {}
        }

        function setFotoFundo(url) {
            fabric.Image.fromURL(url, function(img) {
                if(imgFundo) canvas.remove(imgFundo);
                imgFundo = img;
                
                // Enquadramento sem achatar
                const canvasW = canvas.width;
                const canvasH = canvas.height;
                const scale = Math.max(canvasW / img.width, canvasH / img.height);
                
                img.set({
                    originX: 'center',
                    originY: 'center',
                    left: canvasW / 2,
                    top: canvasH / 2,
                    scaleX: scale,
                    scaleY: scale,
                    selectable: false,
                    evented: false
                });

                canvas.add(img);
                canvas.sendToBack(img);
                canvas.renderAll();
            }, { crossOrigin: 'anonymous' });
        }

        function setLogoFlyer(url) {
            fabric.Image.fromURL(url, function(img) {
                if(objLogo) canvas.remove(objLogo);
                objLogo = img;
                
                const targetSize = 65;
                const scale = targetSize / Math.max(img.width, img.height);
                
                img.set({
                    left: 390,
                    top: 20,
                    scaleX: scale,
                    scaleY: scale,
                    cornerColor: '#ff4757',
                    borderColor: '#ff4757',
                    cornerSize: 8,
                    transparentCorners: false
                });

                canvas.add(img);
                canvas.bringToFront(img);
                canvas.renderAll();
            }, { crossOrigin: 'anonymous' });
        }

        // Atualização em Tempo Real dos Textos
        function atualizarTextoObjeto(tipo, valor) {
            if(tipo === 'titulo' && objTitulo) objTitulo.set('text', valor.toUpperCase());
            if(tipo === 'selo' && objSelo) objSelo.set('text', valor.toUpperCase());
            if(tipo === 'rodape' && objRodape) objRodape.set('text', valor.toUpperCase());
            canvas.renderAll();
        }

        // Puxar do Cardápio
        function importarDoCardapio(id) {
            if(!id) return;
            const p = produtosCatalogo.find(x => x.id === parseInt(id));
            if(!p) return;

            document.getElementById('inp-titulo').value = p.nome.toUpperCase();
            atualizarTextoObjeto('titulo', p.nome);

            const deVal = `R$ ${p.preco_venda.toFixed(2).replace('.', ',')}`;
            document.getElementById('inp-de').value = deVal;
            sincronizarPreco('de', deVal);

            if(p.imagem_url) setFotoFundo(p.imagem_url);
        }

        // Sincronização de Preços
        function sincronizarPreco(origem, val) {
            let de = parseFloat(document.getElementById('inp-de').value.replace('R$','').replace(',','.').trim()) || 0;
            let pct = parseFloat(document.getElementById('inp-pct').value) || 0;
            let por = parseFloat(document.getElementById('inp-por').value.replace('R$','').replace(',','.').trim()) || 0;

            if(origem === 'pct' && de > 0) {
                por = de * (1 - (pct / 100));
                document.getElementById('inp-por').value = `R$ ${por.toFixed(2).replace('.', ',')}`;
            } else if(origem === 'por' && de > 0 && por < de) {
                pct = Math.round(((de - por) / de) * 100);
                document.getElementById('inp-pct').value = pct;
            } else if(origem === 'de' && pct > 0) {
                por = de * (1 - (pct / 100));
                document.getElementById('inp-por').value = `R$ ${por.toFixed(2).replace('.', ',')}`;
            }

            if(objDe) objDe.set('text', `De: R$ ${de.toFixed(2).replace('.', ',')}`);
            if(objPor) objPor.set('text', `POR R$ ${por.toFixed(2).replace('.', ',')}`);
            if(objBadgePct) objBadgePct.set('text', `⚡ ${pct}% DE DESCONTO`);
            canvas.renderAll();
        }

        function definirModoPreco(modo) {
            if(!objDe || !objPor || !objBadgePct) return;
            
            objDe.set('visible', modo === 'ambos' || modo === 'preco');
            objPor.set('visible', modo === 'ambos' || modo === 'preco');
            objBadgePct.set('visible', modo === 'ambos' || modo === 'pct');
            
            canvas.renderAll();
        }

        // 🚨 ZOOM E MOVIMENTO DA FOTO 🚨
        let baseScale = 1;
        function ajustarZoomFoto(val) {
            if(!imgFundo) return;
            const pct = parseInt(val);
            document.getElementById('lbl-zoom').innerText = `${pct}%`;
            
            const novoScale = (Math.max(canvas.width / imgFundo.width, canvas.height / imgFundo.height)) * (pct / 100);
            imgFundo.scale(novoScale);
            canvas.renderAll();
        }

        function moverFoto(direcao) {
            if(!imgFundo) return;
            const passo = 25;
            if(direcao === 'cima') imgFundo.top -= passo;
            if(direcao === 'baixo') imgFundo.top += passo;
            if(direcao === 'esq') imgFundo.left -= passo;
            if(direcao === 'dir') imgFundo.left += passo;
            canvas.renderAll();
        }

        function carregarFotoCustomizada(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => setFotoFundo(e.target.result);
                reader.readAsDataURL(file);
            }
        }

        function carregarLogoFlyer(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => setLogoFlyer(e.target.result);
                reader.readAsDataURL(file);
            }
        }

        // 🚨 FILTROS INSTAGRAM E LUZ 🚨
        function aplicarFiltroInstagram(tipo) {
            if(!imgFundo) return;
            imgFundo.filters = [];

            if(tipo === 'cake') {
                // Clareia e destaca os tons doces e confeitados
                imgFundo.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.08 }));
                imgFundo.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.05 }));
                imgFundo.filters.push(new fabric.Image.filters.Saturation({ saturation: 0.15 }));
            } else if(tipo === 'burger') {
                // Quente e dourado para lanches
                imgFundo.filters.push(new fabric.Image.filters.Brightness({ brightness: -0.02 }));
                imgFundo.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.18 }));
                imgFundo.filters.push(new fabric.Image.filters.Saturation({ saturation: 0.35 }));
            } else if(tipo === 'vivid') {
                imgFundo.filters.push(new fabric.Image.filters.Saturation({ saturation: 0.5 }));
            } else if(tipo === 'pb') {
                imgFundo.filters.push(new fabric.Image.filters.Grayscale());
            }

            imgFundo.applyFilters();
            canvas.renderAll();
        }

        function aplicarFiltroManual() {
            if(!imgFundo) return;
            const b = parseFloat(document.getElementById('rng-brilho').value);
            const c = parseFloat(document.getElementById('rng-contraste').value);
            const s = parseFloat(document.getElementById('rng-saturacao').value);

            document.getElementById('lbl-brilho').innerText = `${Math.round(b*100)}%`;
            document.getElementById('lbl-contraste').innerText = `${Math.round(c*100)}%`;
            document.getElementById('lbl-saturacao').innerText = `${Math.round(s*100)}%`;

            imgFundo.filters = [
                new fabric.Image.filters.Brightness({ brightness: b }),
                new fabric.Image.filters.Contrast({ contrast: c }),
                new fabric.Image.filters.Saturation({ saturation: s })
            ];
            imgFundo.applyFilters();
            canvas.renderAll();
        }

        function resetarFiltros() {
            if(!imgFundo) return;
            imgFundo.filters = [];
            imgFundo.applyFilters();
            document.getElementById('rng-brilho').value = 0;
            document.getElementById('rng-contraste').value = 0;
            document.getElementById('rng-saturacao').value = 0;
            canvas.renderAll();
        }

        // 🚨 PINCEL DE RETOQUE / BORRACHA 🚨

        // Alinhamentos Rápidos
        function centralizarElemento() {
            const ativo = canvas.getActiveObject();

        // Mudança de Abas
        function mudarAba(aba, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            ['produto', 'foto', 'edicao', 'marca'].forEach(id => {
                document.getElementById(`painel-${id}`).classList.toggle('hidden', id !== aba);
            });
            if(aba !== 'edicao') ativarModoPintura(false);
        }

        // 🚨 DOWNLOAD NATIVO EM ALTA RESOLUÇÃO (ZERO CORTES) 🚨
        function baixarImagemPNG() {
            const btn = document.getElementById('btn-baixar');
            const txt = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg mr-2"></i> Renderizando...';
            btn.disabled = true;

            // Desmarca qualquer seleção antes de exportar
            canvas.discardActiveObject();
            canvas.renderAll();

            setTimeout(() => {
                // Exporta em Dobro da Resolução (960 x 1200 px) para qualidade impecável no WhatsApp
                const dataURL = canvas.toDataURL({
                    format: 'png',
                    multiplier: 2
                });

                const link = document.createElement('a');
                const nomeLimpo = (objTitulo ? objTitulo.text : 'Anuncio').replace(/[^a-zA-Z0-9]/g, '_');
                link.download = `Flyer_${temaAtual.toUpperCase()}_${nomeLimpo}.png`;
                link.href = dataURL;
                link.click();

                btn.innerHTML = '<i class="ph-bold ph-check mr-2 text-lg"></i> Imagem Salva!';
                setTimeout(() => { btn.innerHTML = txt; btn.disabled = false; }, 2000);
            }, 300);
        }

        // 🚨 CRIAÇÃO DE VÍDEO ANIMADO (STATUS / STORIES) 🚨
        function gerarVideoAnimado() {
            const btn = document.getElementById('btn-video');
            const txt = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg mr-2"></i> Gravando 5s...';
            btn.disabled = true;

            canvas.discardActiveObject();
            canvas.renderAll();

            const canvasDom = document.getElementById('canvas-studio');
            const stream = canvasDom.captureStream(30);
            let recorder;
            try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            } catch(e) {
                recorder = new MediaRecorder(stream);
            }

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Video_Status_${temaAtual.toUpperCase()}.webm`;
                a.click();

                btn.innerHTML = '<i class="ph-bold ph-check mr-2 text-lg"></i> Vídeo Pronto!';
                setTimeout(() => { btn.innerHTML = txt; btn.disabled = false; }, 2000);
            };

            recorder.start();

            // Animação de 5 segundos (Zoom Suave na Foto + Pulso no Selo de Oferta)
            let frame = 0;
            const totalFrames = 150; // 5 segundos a 30fps
            const scaleInicial = imgFundo ? imgFundo.scaleX : 1;

            function animar() {
                frame++;
                if(imgFundo) {
                    imgFundo.scale(scaleInicial * (1 + 0.0006 * frame)); // Zoom lento
                }
                if(objBadgePct) {
                    objBadgePct.set('scaleX', 1 + 0.06 * Math.sin(frame * 0.15));
                    objBadgePct.set('scaleY', 1 + 0.06 * Math.sin(frame * 0.15));
                }
                canvas.renderAll();

                if(frame < totalFrames) {
                    requestAnimationFrame(animar);
                } else {
                    recorder.stop();
                    // Restaura tamanho original
                    if(imgFundo) imgFundo.scale(scaleInicial);
                    if(objBadgePct) { objBadgePct.set('scaleX', 1); objBadgePct.set('scaleY', 1); }
                    canvas.renderAll();
                }
            }
            animar();
        }

        function copiarLegendaZap() {
            const tit = objTitulo ? objTitulo.text : '';
            const de = document.getElementById('inp-de').value;
            const por = document.getElementById('inp-por').value;
            const pct = document.getElementById('inp-pct').value;

            const msg = `✨ *${tit}*\n\n🔥 *SUPER OFERTA DE ${pct}% OFF!*\n❌ De: ${de}\n✅ *Por apenas: ${por}!* 😋\n\n👉 Peça agora pelo cardápio ou mande seu pedido por aqui!`;
            navigator.clipboard.writeText(msg);
            alert("Legenda copiada para o WhatsApp! 📋");
        }
